<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff007a;
            --bg-dark: #06090f;
            --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* BLOBS ANIMATI (SFONDO) */
        .blobs {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            filter: blur(70px);
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: move 15s infinite alternate ease-in-out;
        }
        .blob-1 { width: 50vw; height: 50vw; background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { width: 60vw; height: 60vw; background: var(--accent); bottom: -10%; right: -10%; animation-delay: -7s; }
        .blob-3 { width: 30vw; height: 30vw; background: #0081ff; top: 30%; right: 10%; animation-duration: 20s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(40px, 60px) scale(1.2); }
        }

        /* CARD GLASSMORPHISM CON BORDO GRADIENTE */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            /* Bordo sfumato come nell'immagine */
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05)), 
                              linear-gradient(135deg, var(--primary), var(--accent));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            
            padding: 3rem 2rem;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            z-index: 10;
            transition: transform 0.4s ease;
        }

        /* LOGO CON GLOW BIANCO PER VISIBILITÀ */
        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        /* L'alone bianco che salva il logo */
        .logo-container::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%; height: 80%;
            background: white;
            filter: blur(35px);
            opacity: 0.3;
            z-index: -1;
        }
        .logo { height: 65px; width: auto; filter: brightness(1.1); }

        h2 { color: #fff; font-weight: 800; font-size: 2rem; margin-bottom: 0.2rem; }
        .subtitle { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 2rem; }
        #status-text { color: rgba(255,255,255,0.5); font-size: 0.75rem; margin-bottom: 1.5rem; }

        /* INPUTS */
        .input-group { margin-bottom: 1rem; width: 100%; }
        .input-group input {
            width: 100%; padding: 1.1rem; 
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 12px; color: #fff; font-size: 16px; 
            outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); background: rgba(0, 0, 0, 0.5); }
        .input-group input::placeholder { color: rgba(255,255,255,0.3); }

        /* BUTTON GRADIENT COME IMMAGINE */
        .login-btn {
            width: 100%; padding: 1.1rem; 
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff; border: none; border-radius: 12px; 
            font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
            margin-top: 1rem;
        }
        .login-btn:hover { filter: brightness(1.1); transform: scale(1.02); }
        .login-btn:disabled { opacity: 0.4; cursor: wait; }

        #error-msg { color: var(--error); font-size: 0.8rem; font-weight: 700; margin-top: 1rem; display: none; }
        
        footer { position: fixed; bottom: 20px; color: rgba(255,255,255,0.4); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="login-card" id="card">
        <div class="logo-container">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="logo" alt="Logo Scarpa">
        </div>
        <h2>Area Riservata</h2>
        <div class="subtitle">Accesso Portale Acquisti</div>
        
        <p id="status-text">Sincronizzazione...</p>

        <div class="input-group">
            <input type="text" id="user" placeholder="Username" required>
        </div>

        <div class="input-group">
            <input type="password" id="pass" placeholder="Password" required>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>ACCEDI AL PORTALE</button>
        <div id="error-msg">Credenziali non valide</div>
    </div>

    <footer>IIS ANTONIO SCARPA — SMART SYSTEM 2026</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        async function loadUsers() {
            try {
                const response = await fetch(`${USERS_CSV_URL}&t=${Date.now()}`);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return { u: columns[0]?.trim(), p: columns[1]?.trim() };
                }).filter(user => user.u && user.p);

                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerText = "ACCEDI AL PORTALE";
                document.getElementById('status-text').innerText = "Pronto per l'autenticazione";
            } catch (error) {
                document.getElementById('status-text').innerText = "Database offline.";
            }
        }

        function handleLogin() {
            const uInput = document.getElementById('user').value.trim();
            const pInput = document.getElementById('pass').value.trim();
            const card = document.getElementById('card');
            const error = document.getElementById('error-msg');

            const found = authorizedUsers.find(user => user.u === uInput && user.p === pInput);

            if (found) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-20px) scale(0.95)';
                localStorage.setItem('scarpa_auth', 'true');
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } else {
                error.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        loadUsers();
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) handleLogin();
        });
    </script>
</body>
</html>
