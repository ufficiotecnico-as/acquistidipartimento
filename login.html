<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Area Riservata Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #58a6ff;
            --error: #f85149;
            --bg-dark: #0d1117;
            --glass: rgba(22, 27, 34, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* SFONDO ANIMATO */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, #161b22 0%, #0d1117 100%);
            z-index: -1;
        }

        .bg-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(88, 166, 255, 0.15) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.8; }
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .logo { height: 50px; margin-bottom: 30px; }
        h2 { color: #fff; font-weight: 800; font-size: 1.8rem; margin-bottom: 10px; letter-spacing: -1px; }
        p { color: #8b949e; font-size: 0.95rem; margin-bottom: 35px; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group input {
            width: 100%; padding: 15px; background: rgba(13, 17, 23, 0.8);
            border: 2px solid #30363d; border-radius: 12px; color: #fff;
            font-size: 1rem; outline: none; transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15); }
        .input-group label {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #8b949e; pointer-events: none; transition: all 0.3s ease;
        }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label {
            top: -10px; left: 10px; font-size: 0.75rem; font-weight: 800; color: var(--primary);
            background: var(--bg-dark); padding: 0 5px;
        }

        .login-btn {
            width: 100%; padding: 16px; background: var(--primary); color: #fff;
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease; margin-top: 10px;
        }
        .login-btn:disabled { opacity: 0.5; cursor: wait; }

        #error-msg { color: var(--error); font-size: 0.85rem; font-weight: 600; margin-top: 20px; display: none; }
        
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        footer { position: absolute; bottom: 20px; color: #484f58; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card" id="card">
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="logo">
        <h2>Area Riservata</h2>
        <p id="status-text">Caricamento sistema...</p>

        <div class="input-group">
            <input type="text" id="user" placeholder=" " required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="pass" placeholder=" " required>
            <label>Password</label>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>ATTENDI...</button>
        
        <div id="error-msg">Credenziali errate o utente non autorizzato.</div>
    </div>

    <footer>IIS ANTONIO SCARPA — PORTALE ACQUISTI v18.0</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        // 1. Carica gli utenti dal CSV all'avvio
        async function loadUsers() {
            try {
                const response = await fetch(USERS_CSV_URL);
                const data = await response.text();
                
                // Parsa il CSV (assume Colonna A: Username, Colonna B: Password)
                const rows = data.split('\n').slice(1); // Salta l'intestazione
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return {
                        username: columns[0]?.trim(),
                        password: columns[1]?.trim()
                    };
                }).filter(u => u.username && u.password);

                // Abilita il login
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerText = "ACCEDI AL PORTALE";
                document.getElementById('status-text').innerText = "Inserisci le tue credenziali";
            } catch (error) {
                console.error("Errore caricamento utenti:", error);
                document.getElementById('status-text').innerText = "Errore di connessione al database.";
            }
        }

        // 2. Gestione del Login
        function handleLogin() {
            const uInput = document.getElementById('user').value.trim();
            const pInput = document.getElementById('pass').value.trim();
            const card = document.getElementById('card');
            const error = document.getElementById('error-msg');

            // Cerca l'utente nel database caricato
            const userFound = authorizedUsers.find(u => u.username === uInput && u.password === pInput);

            if (userFound) {
                // Successo
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                localStorage.setItem('scarpa_auth', 'true');
                localStorage.setItem('scarpa_user', uInput); // Opzionale: salva chi è loggato
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 400);
            } else {
                // Errore
                error.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        // Avvio
        loadUsers();

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) handleLogin();
        });
    </script>
</body>
</html>
