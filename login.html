<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05080d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00d2ff; --accent: #ff007a; --bg: #05080d; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* FIX: Impedisce al logo di sdoppiarsi scrollando */
            position: relative;
        }

        /* SFONDO ANIMATO OTTIMIZZATO */
        .blobs { position: absolute; width: 100%; height: 100%; overflow: hidden; z-index: 1; filter: blur(50px); }
        .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: move 20s infinite alternate; }
        .blob-1 { width: 300px; height: 300px; background: var(--primary); top: -50px; left: -50px; }
        .blob-2 { width: 350px; height: 350px; background: var(--accent); bottom: -50px; right: -50px; }

        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(30px, 30px); } }

        /* CARD GLASSMORPHISM */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem;
            border-radius: 28px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo-container { margin-bottom: 1.5rem; }
        .main-logo { width: 140px; height: auto; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
        .school-brand { color: white; font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; }

        h2 { color: #fff; margin: 10px 0 5px; font-size: 1.5rem; }
        .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .input-field {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        footer { position: absolute; bottom: 20px; color: rgba(255,255,255,0.2); font-size: 0.7rem; z-index: 5; }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card">
        <div class="logo-container">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png" class="main-logo">
            <div class="school-brand">IIS A. SCARPA</div>
        </div>

        <h2>Area Riservata</h2>
        <div class="subtitle">Accesso Portal 2026</div>

        <input type="text" class="input-field" id="user" placeholder="Username">
        <input type="password" class="input-field" id="pass" placeholder="Password">

        <button class="login-btn" onclick="handleLogin()">Accedi</button>
    </div>

    <footer>SMART SYSTEM V2.1</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authUsers = [];

        async function loadUsers() {
            try {
                const res = await fetch(`${USERS_CSV_URL}&t=${Date.now()}`);
                const text = await res.text();
                authUsers = text.split('\n').slice(1).map(r => {
                    const c = r.split(',');
                    return { u: c[0]?.trim(), p: c[1]?.trim() };
                });
            } catch (e) { console.error("Sync Error"); }
        }

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            if (authUsers.find(x => x.u === u && x.p === p)) {
                localStorage.setItem('scarpa_auth', 'true');
                window.location.href = 'index.html';
            } else { alert("Dati errati"); }
        }
        loadUsers();
    </script>
</body>
</html>
