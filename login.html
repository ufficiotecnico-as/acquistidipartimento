<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --accent: #ff007a; --bg-dark: #06090f; --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif; background: var(--bg-dark);
            min-height: 100dvh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
            position: relative; padding: 20px;
        }

        /* SFONDO DINAMICO */
        .blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(70px); pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; opacity: 0.5; animation: move 15s infinite alternate ease-in-out; }
        .blob-1 { width: 50vw; height: 50vw; background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { width: 60vw; height: 60vw; background: var(--accent); bottom: -10%; right: -10%; animation-delay: -7s; }

        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(40px, 60px) scale(1.2); } }

        /* CARD GLASSMORPHISM */
        .login-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 2px solid transparent;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.05)), 
                              linear-gradient(135deg, var(--primary), var(--accent));
            background-origin: border-box; background-clip: padding-box, border-box;
            padding: 3rem 2rem; border-radius: 30px; width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); z-index: 10;
        }

        /* LOGO SVG INTEGRATO */
        .logo-box { margin-bottom: 1.5rem; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }
        .logo-svg { width: 80px; height: auto; fill: white; }
        .logo-text { color: white; font-weight: 800; font-size: 0.9rem; letter-spacing: 2px; margin-top: 5px; }
        .logo-subtext { color: white; font-weight: 400; font-size: 0.6rem; letter-spacing: 4px; opacity: 0.8; }

        h2 { color: #fff; font-weight: 800; font-size: 1.8rem; margin-top: 10px; }
        .subtitle { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-bottom: 2rem; }

        /* INPUTS */
        .input-group { margin-bottom: 1rem; }
        .input-group input {
            width: 100%; padding: 1.1rem; background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            color: #fff; font-size: 16px; outline: none; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--primary); }

        /* BUTTON */
        .login-btn {
            width: 100%; padding: 1.1rem; 
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: #fff; border: none; border-radius: 12px; font-size: 1rem;
            font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }
        .login-btn:hover { filter: brightness(1.2); transform: scale(1.02); }

        footer { position: fixed; bottom: 20px; color: rgba(255,255,255,0.3); font-size: 0.6rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>

    <div class="login-card" id="card">
        <div class="logo-box">
            <svg class="logo-svg" viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 20 L80 40 L50 60 L20 40 Z" fill="none" stroke="white" stroke-width="4"/>
                <path d="M50 10 C60 10 70 20 70 30 L50 45 L30 30 C30 20 40 10 50 10 Z" fill="white"/>
                <rect x="48" y="45" width="4" height="20" fill="white"/>
            </svg>
            <div class="logo-text">IIS ANTONIO</div>
            <div class="logo-subtext">SCARPA</div>
        </div>

        <h2>Area Riservata</h2>
        <div class="subtitle">Accesso Portale Acquisti</div>

        <div class="input-group"><input type="text" id="user" placeholder="Username" required></div>
        <div class="input-group"><input type="password" id="pass" placeholder="Password" required></div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()">ACCEDI AL PORTALE</button>
    </div>

    <footer>IIS ANTONIO SCARPA — SMART SYSTEM 2026</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        async function loadUsers() {
            try {
                const response = await fetch(`${USERS_CSV_URL}&t=${Date.now()}`);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return { u: columns[0]?.trim(), p: columns[1]?.trim() };
                }).filter(user => user.u && user.p);
            } catch (e) { console.log("Errore caricamento database"); }
        }

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            const found = authorizedUsers.find(user => user.u === u && user.p === p);

            if (found) {
                localStorage.setItem('scarpa_auth', 'true');
                window.location.href = 'index.html';
            } else {
                alert("Dati errati!");
            }
        }
        loadUsers();
    </script>
</body>
</html>
