<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --secondary: #92fe9d; --accent: #ff007a;
            --bg-dark: #06090f; --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow-x: hidden;
        }

        /* SFONDO ANIMATO */
        .blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(60px); pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: move 20s infinite alternate; }
        .blob-1 { width: 60vw; height: 60vw; background: var(--primary); top: -20%; left: -10%; }
        .blob-2 { width: 70vw; height: 70vw; background: var(--accent); bottom: -20%; right: -10%; animation-delay: -5s; }
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(20px, 40px) scale(1.1); } }

        /* CARD */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 2rem;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
        }

        /* FIX VISIBILITÀ LOGO */
        .logo-container {
            background: rgba(255, 255, 255, 0.9); /* Sfondo chiaro per far vedere il nero del logo */
            padding: 12px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        .logo { height: 45px; width: auto; display: block; }

        h2 { 
            color: #fff; font-weight: 800; font-size: 1.6rem; margin-bottom: 0.5rem; 
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 2rem; }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 1.5rem; width: 100%; text-align: left; }
        .input-group input {
            width: 100%; padding: 1rem 1.2rem; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 14px; color: #fff; font-size: 16px; 
            outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }

        .input-group label {
            position: absolute; left: 1.2rem; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.4); pointer-events: none; transition: 0.2s;
        }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label {
            top: -0.6rem; left: 0.8rem; font-size: 0.7rem; font-weight: 800; color: var(--primary);
            background: #0d1117; padding: 0 6px; border-radius: 4px;
        }

        /* BUTTON */
        .login-btn {
            width: 100%; padding: 1.1rem; 
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #06090f; border: none; border-radius: 14px; 
            font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .login-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }

        #error-msg { color: var(--error); font-size: 0.8rem; font-weight: 700; margin-top: 1rem; display: none; }
        
        footer { margin-top: 2rem; color: rgba(255,255,255,0.2); font-size: 0.6rem; letter-spacing: 1px; }

        /* MOBILE FIX */
        @media (max-height: 600px) {
            .login-card { padding: 1.5rem; }
            .logo-container { margin-bottom: 1rem; padding: 8px; }
            .logo { height: 35px; }
        }

        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card" id="card">
        <div class="logo-container">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="logo" alt="IIS Scarpa">
        </div>
        
        <h2>Area Riservata</h2>
        <p id="status-text">Connessione al database...</p>

        <div class="input-group">
            <input type="text" id="user" placeholder=" " required autocomplete="username">
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="pass" placeholder=" " required autocomplete="current-password">
            <label>Password</label>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>Entra</button>
        <div id="error-msg">Dati di accesso errati</div>
    </div>

    <footer>IIS ANTONIO SCARPA — SMART SYSTEM 2026</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        async function loadUsers() {
            try {
                const response = await fetch(`${USERS_CSV_URL}&t=${Date.now()}`);
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return { u: columns[0]?.trim(), p: columns[1]?.trim() };
                }).filter(user => user.u && user.p);

                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerText = "Accedi";
                document.getElementById('status-text').innerText = "Database sincronizzato";
            } catch (error) {
                document.getElementById('status-text').innerText = "Errore di rete.";
            }
        }

        function handleLogin() {
            const uInput = document.getElementById('user').value.trim();
            const pInput = document.getElementById('pass').value.trim();
            const card = document.getElementById('card');
            const error = document.getElementById('error-msg');

            const found = authorizedUsers.find(user => user.u === uInput && user.p === pInput);

            if (found) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-10px) scale(0.95)';
                localStorage.setItem('scarpa_auth', 'true');
                setTimeout(() => { window.location.href = 'index.html'; }, 400);
            } else {
                error.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        loadUsers();
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) handleLogin();
        });
    </script>
</body>
</html>
