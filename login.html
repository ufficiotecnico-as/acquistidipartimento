<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --secondary: #92fe9d; --accent: #ff007a;
            --bg-dark: #06090f; --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            /* Supporto per tastiere mobile e dynamic viewport */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow-y: auto; /* Permette lo scroll se lo schermo è piccolo */
            overflow-x: hidden;
        }

        /* BLOBS SFONDO - Ottimizzati per non pesare */
        .blobs { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; filter: blur(60px); pointer-events: none;
        }
        .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: move 20s infinite alternate; }
        .blob-1 { width: 60vw; height: 60vw; background: var(--primary); top: -20%; left: -10%; }
        .blob-2 { width: 70vw; height: 70vw; background: var(--accent); bottom: -20%; right: -10%; animation-delay: -5s; }
        
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(20px, 40px) scale(1.1); } }
