<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login | Smart Portal Scarpa</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#05080d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00d2ff; --accent: #ff007a; --bg: #05080d; }
        
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

        body, html {
            height: 100%;
            width: 100%;
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Blocca lo scroll dello screenshot */
            position: fixed; /* Impedisce il rimbalzo su iPhone/Android */
        }

        /* Sfondo responsive */
        .wrapper {
            height: 100dvh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at top left, #1a1a2e, #05080d);
        }

        .blobs {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; filter: blur(60px);
            overflow: hidden;
        }

        .blob { position: absolute; border-radius: 50%; opacity: 0.4; animation: move 15s infinite alternate; }
        .blob-1 { width: 60vw; height: 60vw; background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { width: 70vw; height: 70vw; background: var(--accent); bottom: -10%; right: -10%; }

        @keyframes move { from { transform: translate(0,0); } to { transform: translate(10%, 10%); } }

        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem 1.5rem;
            border-radius: 30px;
            width: 85%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .main-logo {
            width: 160px; /* Dimensione fissa per mobile */
            height: auto;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .school-brand { 
            color: white; 
            font-weight: 800; 
            font-size: 1rem; 
            letter-spacing: 2px; 
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .input-field {
            width: 100%;
            height: 55px;
            padding: 0 15px;
            margin-bottom: 15px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 16px; /* Evita zoom automatico su iPhone */
            outline: none;
            -webkit-appearance: none;
        }

        .login-btn {
            width: 100%;
            height: 55px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            color: white;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        footer { 
            position: absolute; 
            bottom: 20px; 
            color: rgba(255,255,255,0.2); 
            font-size: 0.6rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="blobs">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>

        <div class="login-card">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png" class="main-logo" alt="Logo">
            <div class="school-brand">IIS A. SCARPA</div>

            <input type="text" class="input-field" id="user" placeholder="Username" inputmode="text">
            <input type="password" class="input-field" id="pass" placeholder="Password">

            <button class="login-btn" onclick="handleLogin()">Accedi</button>
        </div>

        <footer>Secure Access System 2.1</footer>
    </div>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authUsers = [];

        async function loadUsers() {
            try {
                const res = await fetch(`${USERS_CSV_URL}&t=${Date.now()}`);
                const text = await res.text();
                authUsers = text.split('\n').slice(1).map(r => {
                    const c = r.split(',');
                    return { u: c[0]?.trim(), p: c[1]?.trim() };
                });
            } catch (e) { console.error("Sync Error"); }
        }

        function handleLogin() {
            const u = document.getElementById('user').value.trim();
            const p = document.getElementById('pass').value.trim();
            if (authUsers.find(x => x.u === u && x.p === p)) {
                localStorage.setItem('scarpa_auth', 'true');
                window.location.href = 'index.html';
            } else { alert("Dati errati"); }
        }
        loadUsers();
    </script>
</body>
</html>
