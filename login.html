<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Smart Portal Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --secondary: #92fe9d; --accent: #ff007a;
            --bg-dark: #06090f; --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Evita scroll dei blob */
            position: relative;
            padding: 20px;
        }

        /* BLOBS RESPONSIVE */
        .blobs { position: absolute; width: 100%; height: 100%; z-index: -1; filter: blur(60px); }
        .blob { position: absolute; border-radius: 50%; opacity: 0.5; animation: move 20s infinite alternate; }
        .blob-1 { width: 35vw; height: 35vw; background: var(--primary); top: -10%; left: -5%; }
        .blob-2 { width: 40vw; height: 40vw; background: var(--accent); bottom: -10%; right: -5%; animation-duration: 15s; }
        
        @keyframes move { from { transform: translate(0, 0) scale(1); } to { transform: translate(30px, 50px) scale(1.1); } }

        /* CARD */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo { height: 50px; margin-bottom: 20px; max-width: 100%; object-fit: contain; }

        h2 { 
            color: #fff; font-weight: 800; font-size: 1.7rem; margin-bottom: 8px; 
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        p { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 30px; }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 14px 18px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; color: #fff; font-size: 1rem; outline: none; transition: 0.3s;
            appearance: none; /* Rimuove ombre iOS */
        }
        .input-group input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }

        .input-group label {
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.4); pointer-events: none; transition: 0.3s; font-size: 0.9rem;
        }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label {
            top: -10px; left: 12px; font-size: 0.7rem; font-weight: 800; color: var(--primary);
            background: var(--bg-dark); padding: 0 6px; border-radius: 4px;
        }

        /* BUTTON */
        .login-btn {
            width: 100%; padding: 16px; 
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #06090f; border: none; border-radius: 12px; 
            font-size: 0.95rem; font-weight: 800; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-btn:active { transform: scale(0.98); }

        #error-msg { color: var(--error); font-size: 0.8rem; font-weight: 700; margin-top: 15px; display: none; }
        
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        footer { position: absolute; bottom: 15px; color: rgba(255,255,255,0.2); font-size: 0.6rem; letter-spacing: 1px; }

        /* MEDIA QUERY PER MOBILE STRETTO */
        @media (max-width: 400px) {
            .login-card { padding: 30px 20px; }
            h2 { font-size: 1.4rem; }
            .logo { height: 40px; }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="login-card" id="card">
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="logo">
        <h2 id="title">Accedi</h2>
        <p id="status-text">Sincronizzazione database...</p>

        <div class="input-group">
            <input type="text" id="user" placeholder=" " required autocomplete="username">
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="pass" placeholder=" " required autocomplete="current-password">
            <label>Password</label>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>Attendi...</button>
        <div id="error-msg">Dati non corretti</div>
    </div>

    <footer>IIS SCARPA PORTAL © 2026</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        async function loadUsers() {
            try {
                const response = await fetch(USERS_CSV_URL + '?t=' + Date.now());
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return { u: columns[0]?.trim(), p: columns[1]?.trim() };
                }).filter(user => user.u && user.p);

                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerText = "Accedi";
                document.getElementById('status-text').innerText = "Database pronto";
            } catch (error) {
                document.getElementById('status-text').innerText = "Offline. Controlla connessione.";
            }
        }

        function handleLogin() {
            const uInput = document.getElementById('user').value.trim();
            const pInput = document.getElementById('pass').value.trim();
            const card = document.getElementById('card');
            const error = document.getElementById('error-msg');

            const found = authorizedUsers.find(user => user.u === uInput && user.p === pInput);

            if (found) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(-10px)';
                localStorage.setItem('scarpa_auth', 'true');
                setTimeout(() => { window.location.href = 'index.html'; }, 400);
            } else {
                error.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        loadUsers();
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) handleLogin();
        });
    </script>
</body>
</html>
