<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Portale Acquisti Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #92fe9d;
            --accent: #ff007a;
            --bg-dark: #06090f;
            --error: #ff4b2b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* SFONDO CON BLOBS COLORATI ANIMATI */
        .blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: move 20s infinite alternate;
        }

        .blob-1 { width: 400px; height: 400px; background: var(--primary); top: -10%; left: -10%; }
        .blob-2 { width: 450px; height: 450px; background: var(--accent); bottom: -10%; right: -10%; animation-duration: 15s; }
        .blob-3 { width: 300px; height: 300px; background: var(--secondary); top: 40%; right: 20%; animation-duration: 12s; }

        @keyframes move {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(50px, 100px) scale(1.2); }
        }

        /* CARD EFFETTO VETRO COLORATO */
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .logo { 
            height: 60px; 
            margin-bottom: 25px; 
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }

        h2 { 
            color: #fff; 
            font-weight: 800; 
            font-size: 2rem; 
            margin-bottom: 5px; 
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 35px; letter-spacing: 0.5px; }

        /* INPUTS */
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input {
            width: 100%; padding: 16px 20px; 
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px; color: #fff;
            font-size: 1rem; outline: none; transition: 0.3s;
        }
        .input-group input:focus { 
            border-color: var(--primary); 
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .input-group label {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.4); pointer-events: none; transition: 0.3s;
        }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label {
            top: -12px; left: 15px; font-size: 0.75rem; font-weight: 800; 
            color: var(--primary); text-transform: uppercase;
        }

        /* BUTTON GRADIENT */
        .login-btn {
            width: 100%; padding: 18px; 
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: #06090f; border: none; border-radius: 15px; 
            font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .login-btn:hover { 
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
            filter: brightness(1.1);
        }
        .login-btn:disabled { opacity: 0.5; cursor: wait; background: #333; color: #666; }

        #error-msg { color: var(--error); font-size: 0.85rem; font-weight: 700; margin-top: 20px; display: none; text-shadow: 0 0 10px rgba(255, 75, 43, 0.3); }
        
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        footer { position: absolute; bottom: 30px; color: rgba(255,255,255,0.2); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="login-card" id="card">
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="logo">
        <h2>Area Riservata</h2>
        <p id="status-text">Sincronizzazione database...</p>

        <div class="input-group">
            <input type="text" id="user" placeholder=" " required>
            <label>Username</label>
        </div>

        <div class="input-group">
            <input type="password" id="pass" placeholder=" " required>
            <label>Password</label>
        </div>

        <button class="login-btn" id="loginBtn" onclick="handleLogin()" disabled>Attendi...</button>
        
        <div id="error-msg">Accesso negato. Riprova.</div>
    </div>

    <footer>IIS ANTONIO SCARPA — SMART PORTAL 2026</footer>

    <script>
        const USERS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSVgqrDiEAD3X6HclOFJoVo2xHgwS4TRmgJ8_HRFZFRNSS0ZVm_Hx6lSIsvj31paCckaWY2zY-HMb8J/pub?gid=0&single=true&output=csv';
        let authorizedUsers = [];

        async function loadUsers() {
            try {
                const response = await fetch(USERS_CSV_URL + '?t=' + Date.now());
                const data = await response.text();
                const rows = data.split('\n').slice(1);
                authorizedUsers = rows.map(row => {
                    const columns = row.split(',');
                    return { username: columns[0]?.trim(), password: columns[1]?.trim() };
                }).filter(u => u.username && u.password);

                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').innerText = "Accedi";
                document.getElementById('status-text').innerText = "Pronto per l'autenticazione";
            } catch (error) {
                document.getElementById('status-text').innerText = "Errore di rete.";
            }
        }

        function handleLogin() {
            const uInput = document.getElementById('user').value.trim();
            const pInput = document.getElementById('pass').value.trim();
            const card = document.getElementById('card');
            const error = document.getElementById('error-msg');

            const userFound = authorizedUsers.find(u => u.username === uInput && u.password === pInput);

            if (userFound) {
                card.style.transform = 'translateY(-20px) scale(0.95)';
                card.style.opacity = '0';
                localStorage.setItem('scarpa_auth', 'true');
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } else {
                error.style.display = 'block';
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
        }

        loadUsers();
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !document.getElementById('loginBtn').disabled) handleLogin();
        });
    </script>
</body>
</html>
