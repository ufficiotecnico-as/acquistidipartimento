<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ordini | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --yellow: #d29922; /* IN VALUTAZIONE */
            --purple: #8957e5; /* RICHIESTA INTEGRAZIONE */
            --blue: #1f6feb;   /* APPROVATO - IN ORDINE */
            --green: #238636;  /* COMPLETATO / CONSEGNATO */
            --red: #da3633;    /* RESPINTO */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(var(--border) .1em, transparent .1em), linear-gradient(90deg, var(--border) .1em, transparent .1em);
            background-size: 3em 3em;
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* HEADER BIANCO PER LOGO */
        .white-header {
            background-color: #ffffff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .title-group h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            color: #000000;
            letter-spacing: -1px;
        }

        .title-group p {
            font-size: 0.9rem;
            letter-spacing: 4px;
            color: #444444;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            font-weight: 600;
        }

        .school-logo {
            max-height: 70px;
            width: auto;
        }

        .main-content {
            padding: 0 40px 40px 40px;
        }

        /* TOP CARDS */
        .top-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 40px; }
        .stat-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; 
            position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        .c-valutazione::before { background: var(--yellow); }
        .c-integrazione::before { background: var(--purple); }
        .c-approvato::before { background: var(--blue); }
        .c-completato::before { background: var(--green); }
        .c-respinto::before { background: var(--red); }
        
        .stat-label { font-size: 0.65rem; font-weight: 600; color: #8b949e; text-transform: uppercase; display: block; }
        .stat-value { font-size: 2rem; font-weight: 800; display: block; margin-top: 8px; color: #fff; }

        /* CONTROLS */
        .controls { display: grid; grid-template-columns: 1fr 300px; gap: 20px; margin-bottom: 25px; }
        input, select { 
            background: var(--card); border: 1px solid var(--border); color: white; 
            padding: 12px 20px; border-radius: 8px; outline: none;
        }

        /* TABLE */
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); text-align: left; padding: 15px 25px; font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        td { padding: 18px 25px; border-top: 1px solid var(--border); }
        
        .dept-name { font-weight: 700; color: #fff; }
        
        .badge { 
            padding: 6px 14px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; 
            display: inline-block; border: 1px solid transparent; text-transform: uppercase;
        }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210, 153, 34, 0.1); }
        .b-integrazione { border-color: var(--purple); color: var(--purple); background: rgba(137, 87, 229, 0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31, 111, 235, 0.1); }
        .b-completato { border-color: var(--green); color: var(--green); background: rgba(35, 134, 54, 0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218, 54, 51, 0.1); }

        .priority-text { font-weight: 600; font-size: 0.85rem; }
        .p-alta { color: #ff4444; }
        .p-media { color: #ffbb33; }
        .p-bassa { color: #00c851; }
    </style>
</head>
<body>

    <header class="white-header">
        <div class="title-group">
            <h1>ORDINI DI DIPARTIMENTO</h1>
            <p>IIS ANTONIO SCARPA</p>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" alt="Logo Scarpa" class="school-logo">
    </header>

    <div class="main-content">
        <div class="top-grid">
            <div class="stat-card c-valutazione">
                <span class="stat-label">In Valutazione</span>
                <span class="stat-value" id="count-val">0</span>
            </div>
            <div class="stat-card c-integrazione">
                <span class="stat-label">Richiesta Integrazione</span>
                <span class="stat-value" id="count-int">0</span>
            </div>
            <div class="stat-card c-approvato">
                <span class="stat-label">Approvato - In Ordine</span>
                <span class="stat-value" id="count-app">0</span>
            </div>
            <div class="stat-card c-completato">
                <span class="stat-label">Completato / Consegna</span>
                <span class="stat-value" id="count-com">0</span>
            </div>
            <div class="stat-card c-respinto">
                <span class="stat-label">Respinto</span>
                <span class="stat-value" id="count-res">0</span>
            </div>
        </div>

        <div class="controls">
            <input type="text" id="search" placeholder="Cerca dipartimento..." onkeyup="refresh()">
            <select id="statusFilter" onchange="refresh()">
                <option value="">Tutti gli stati</option>
                <option value="IN VALUTAZIONE">In Valutazione</option>
                <option value="RICHIESTA INTEGRAZIONE">Richiesta Integrazione</option>
                <option value="APPROVATO - IN ORDINE">Approvato - In Ordine</option>
                <option value="COMPLETATO / CONSEGNATO">Completato / Consegnato</option>
                <option value="RESPINTO">Respinto</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Dipartimento</th>
                        <th>Stato Attuale</th>
                        <th>Priorità</th>
                        <th>Aggiornamento</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let db = [];

        async function sync() {
            try {
                const res = await fetch(CSV + '&t=' + Date.now());
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                const clean = {};
                
                rows.forEach(r => {
                    const c = r.split(',');
                    if(c.length < 3) return;
                    const d = c[1].replace(/"/g,'').trim();
                    if(d) clean[d] = {
                        name: d,
                        status: c[2].replace(/"/g,'').trim().toUpperCase(),
                        priority: c[3] ? c[3].replace(/"/g,'').trim() : 'N/D',
                        time: c[0].replace(/"/g,'').trim()
                    };
                });
                db = Object.values(clean);
                refresh();
            } catch(e) { console.error("Errore sync", e); }
        }

        function refresh() {
            const query = document.getElementById('search').value.toLowerCase();
            const filter = document.getElementById('statusFilter').value;
            const body = document.getElementById('tableBody');
            
            const filtered = db.filter(o => 
                (!filter || o.status === filter) && (o.name.toLowerCase().includes(query))
            );

            document.getElementById('count-val').innerText = db.filter(o => o.status === 'IN VALUTAZIONE').length;
            document.getElementById('count-int').innerText = db.filter(o => o.status === 'RICHIESTA INTEGRAZIONE').length;
            document.getElementById('count-app').innerText = db.filter(o => o.status === 'APPROVATO - IN ORDINE').length;
            document.getElementById('count-com').innerText = db.filter(o => o.status === 'COMPLETATO / CONSEGNATO').length;
            document.getElementById('count-res').innerText = db.filter(o => o.status === 'RESPINTO').length;

            body.innerHTML = filtered.map(o => {
                let cls = '';
                if(o.status === 'IN VALUTAZIONE') cls = 'b-valutazione';
                else if(o.status === 'RICHIESTA INTEGRAZIONE') cls = 'b-integrazione';
                else if(o.status === 'APPROVATO - IN ORDINE') cls = 'b-approvato';
                else if(o.status === 'COMPLETATO / CONSEGNATO') cls = 'b-completato';
                else if(o.status === 'RESPINTO') cls = 'b-respinto';

                let pCls = '';
                if(o.priority.toLowerCase() === 'alta') pCls = 'p-alta';
                else if(o.priority.toLowerCase() === 'media') pCls = 'p-media';
                else if(o.priority.toLowerCase() === 'bassa') pCls = 'p-bassa';

                return `<tr>
                    <td class="dept-name">${o.name}</td>
                    <td><span class="badge ${cls}">${o.status}</span></td>
                    <td class="priority-text ${pCls}">${o.priority}</td>
                    <td style="color: #8b949e; font-size: 0.8rem;">${o.time}</td>
                </tr>`;
            }).join('');
        }

        sync();
        setInterval(sync, 20000);
    </script>
</body>
</html>
