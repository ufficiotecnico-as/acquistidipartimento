<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Avanzamento Ordini</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .dept-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            text-align: center;
        }

        .dept-card:hover {
            transform: translateY(-5px);
        }

        .dept-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            background-color: #eee;
        }

        /* Colori per gli stati (personalizzabili in base ai tuoi dati) */
        .status-completato { background-color: #2ecc71; color: white; }
        .status-in-corso { background-color: #f1c40f; color: #333; }
        .status-ritardo { background-color: #e74c3c; color: white; }
        .status-default { background-color: #3498db; color: white; }

        .loading {
            font-style: italic;
            color: #7f8c8d;
        }

        #last-update {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <h1>Stato Avanzamento Ordini</h1>
    
    <div id="dashboard" class="dashboard-container">
        <p class="loading">Caricamento dati in corso...</p>
    </div>

    <p id="last-update"></p>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        async function fetchOrderData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n').slice(1); // Rimuove l'intestazione
                
                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                rows.forEach(row => {
                    if (row.trim() === '') return;
                    
                    // Nota: Se il CSV usa virgole o punti e virgola, potresti dover regolare lo split
                    const columns = row.split(','); 
                    
                    // Assumiamo che il Dipartimento sia la prima colonna e lo Stato la seconda
                    // Se le posizioni sono diverse nel tuo file, cambia gli indici qui sotto:
                    const dipartimento = columns[0].replace(/"/g, ''); 
                    const stato = columns[1] ? columns[1].replace(/"/g, '') : 'N/D';

                    const card = document.createElement('div');
                    card.className = 'dept-card';

                    // Logica semplice per assegnare colori CSS in base al testo dello stato
                    let statusClass = 'status-default';
                    const statoLower = stato.toLowerCase();
                    if (statoLower.includes('complet')) statusClass = 'status-completato';
                    else if (statoLower.includes('corso') || statoLower.includes('progresso')) statusClass = 'status-in-corso';
                    else if (statoLower.includes('ritardo') || statoLower.includes('bloccato')) statusClass = 'status-ritardo';

                    card.innerHTML = `
                        <div class="dept-name">${dipartimento}</div>
                        <div class="status-badge ${statusClass}">${stato}</div>
                    `;
                    dashboard.appendChild(card);
                });

                document.getElementById('last-update').innerText = 'Ultimo aggiornamento: ' + new Date().toLocaleTimeString();

            } catch (error) {
                console.error('Errore nel recupero dati:', error);
                document.getElementById('dashboard').innerHTML = '<p>Errore nel caricamento dei dati.</p>';
            }
        }

        // Aggiornamento iniziale
        fetchOrderData();

        // Aggiorna ogni 60 secondi (real-time apparente)
        setInterval(fetchOrderData, 60000);
    </script>
</body>
</html>
