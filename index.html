<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker Pro - Advanced Dashboard</title>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #161b22;
            --card-hover: #1c2128;
            --accent-green: #238636;
            --accent-yellow: #d29922;
            --accent-blue: #1f6feb;
            --accent-red: #da3633;
            --accent-purple: #8957e5;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1300px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }

        .title-group h1 { margin: 0; font-size: 1.8rem; color: #58a6ff; }
        .title-group p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.9rem; }

        /* Stats Cards con interattività */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: var(--card-hover);
            border-color: #8b949e;
        }

        .stat-card.active { border: 2px solid #58a6ff; background: var(--card-hover); }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
        }

        .card-valutazione::before { background: var(--accent-yellow); }
        .card-integrazione::before { background: var(--accent-purple); }
        .card-approvato::before { background: var(--accent-blue); }
        .card-completato::before { background: var(--accent-green); }
        .card-respinto::before { background: var(--accent-red); }

        .stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 10px; display: block; }

        /* Controlli */
        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #0d1117;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
        }

        .btn-reset {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Tabella Avanzata */
        .table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            background: #161b22;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td { padding: 15px; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #1c2128; }

        .dept-cell { font-weight: 600; color: #adbac7; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-valutazione { background: rgba(210, 153, 34, 0.15); color: var(--accent-yellow); }
        .badge-integrazione { background: rgba(137, 87, 229, 0.15); color: var(--accent-purple); }
        .badge-approvato { background: rgba(31, 111, 235, 0.15); color: var(--accent-blue); }
        .badge-completato { background: rgba(35, 134, 54, 0.15); color: var(--accent-green); }
        .badge-respinto { background: rgba(218, 54, 51, 0.15); color: var(--accent-red); }

        .time-cell { font-family: 'Roboto Mono', monospace; font-size: 0.85rem; color: var(--text-muted); }

        .empty-state { padding: 40px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="title-group">
            <h1>Order Tracker Pro</h1>
            <p>Dashboard intelligente di gestione flussi</p>
        </div>
        <div id="last-update" style="font-size: 0.8rem; color: var(--text-muted);">Sync in corso...</div>
    </header>

    <!-- Cards cliccabili per filtrare -->
    <div class="stats-grid">
        <div class="stat-card card-valutazione" onclick="toggleFilter('IN VALUTAZIONE', this)">
            <span class="stat-label">IN VALUTAZIONE</span>
            <span class="stat-value" id="val-count">0</span>
        </div>
        <div class="stat-card card-integrazione" onclick="toggleFilter('RICHIESTA INTEGRAZIONE', this)">
            <span class="stat-label">INTEGRAZIONE</span>
            <span class="stat-value" id="int-count">0</span>
        </div>
        <div class="stat-card card-approvato" onclick="toggleFilter('APPROVATO - IN ORDINE', this)">
            <span class="stat-label">APPROVATO</span>
            <span class="stat-value" id="app-count">0</span>
        </div>
        <div class="stat-card card-completato" onclick="toggleFilter('COMPLETATO / CONSEGNATO', this)">
            <span class="stat-label">COMPLETATO</span>
            <span class="stat-value" id="com-count">0</span>
        </div>
        <div class="stat-card card-respinto" onclick="toggleFilter('RESPINTO', this)">
            <span class="stat-label">RESPINTO</span>
            <span class="stat-value" id="res-count">0</span>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Cerca dipartimento o parola chiave..." onkeyup="applyFilters()">
        <button class="btn-reset" onclick="resetAll()">Reset</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th width="40%">Dipartimento</th>
                    <th width="30%">Stato Attuale</th>
                    <th width="30%">Informazioni Cronologiche</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Caricamento dinamico -->
            </tbody>
        </table>
        <div id="noResults" class="empty-state" style="display: none;">
            Nessun dato corrispondente ai filtri selezionati.
        </div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
    
    let fullData = [];
    let activeFilter = null;

    async function fetchData() {
        try {
            const response = await fetch(SHEET_URL + '&cb=' + Date.now());
            const text = await response.text();
            const lines = text.split('\n').slice(1);
            
            const latestByDept = {};
            lines.forEach(line => {
                const cols = line.split(',');
                if(cols.length < 3) return;
                const dept = cols[1].replace(/"/g, '').trim();
                if(!dept) return;
                
                latestByDept[dept] = {
                    dept: dept,
                    status: cols[2].replace(/"/g, '').trim().toUpperCase(),
                    time: cols[0].replace(/"/g, '').trim()
                };
            });

            fullData = Object.values(latestByDept);
            updateCounters();
            applyFilters();
            document.getElementById('last-update').innerText = 'Ultimo Sync: ' + new Date().toLocaleTimeString();
        } catch (e) {
            console.error("Errore sync:", e);
        }
    }

    function updateCounters() {
        document.getElementById('val-count').innerText = fullData.filter(d => d.status === 'IN VALUTAZIONE').length;
        document.getElementById('int-count').innerText = fullData.filter(d => d.status === 'RICHIESTA INTEGRAZIONE').length;
        document.getElementById('app-count').innerText = fullData.filter(d => d.status === 'APPROVATO - IN ORDINE').length;
        document.getElementById('com-count').innerText = fullData.filter(d => d.status === 'COMPLETATO / CONSEGNATO').length;
        document.getElementById('res-count').innerText = fullData.filter(d => d.status === 'RESPINTO').length;
    }

    function toggleFilter(status, element) {
        if (activeFilter === status) {
            activeFilter = null;
            element.classList.remove('active');
        } else {
            document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
            activeFilter = status;
            element.classList.add('active');
        }
        applyFilters();
    }

    function resetAll() {
        activeFilter = null;
        document.getElementById('searchInput').value = '';
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        applyFilters();
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const tbody = document.getElementById('tableBody');
        
        const filtered = fullData.filter(d => {
            const matchSearch = d.dept.toLowerCase().includes(search);
            const matchStatus = !activeFilter || d.status === activeFilter;
            return matchSearch && matchStatus;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '';
            document.getElementById('noResults').style.display = 'block';
            return;
        }

        document.getElementById('noResults').style.display = 'none';
        tbody.innerHTML = filtered.map(d => {
            let badgeClass = 'badge-valutazione';
            if(d.status.includes('INTEGRAZIONE')) badgeClass = 'badge-integrazione';
            if(d.status.includes('APPROVATO')) badgeClass = 'badge-approvato';
            if(d.status.includes('COMPLETATO')) badgeClass = 'badge-completato';
            if(d.status.includes('RESPINTO')) badgeClass = 'badge-respinto';

            return `
                <tr>
                    <td class="dept-cell">${d.dept}</td>
                    <td><span class="status-badge ${badgeClass}">${d.status}</span></td>
                    <td class="time-cell">${d.time}</td>
                </tr>
            `;
        }).join('');
    }

    fetchData();
    setInterval(fetchData, 30000);
</script>

</body>
</html>
