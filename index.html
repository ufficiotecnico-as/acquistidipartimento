<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisti Dipartimento | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }

        /* HEADER & TITOLI */
        header { 
            background: #fff; color: #000; padding: 15px 30px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1001; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .brand h1 { margin: 0; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
        .brand p { margin: 0; font-size: 0.75rem; color: #666; font-weight: 600; text-transform: uppercase; }

        /* NAV & HAMBURGER */
        .nav-wrapper { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { 
            padding: 10px 15px; cursor: pointer; border: none; background: transparent; 
            border-radius: 6px; font-weight: 700; color: #444; font-size: 0.8rem; text-transform: uppercase;
        }
        .nav-btn.active { color: var(--blue); background: rgba(88,166,255,0.1); }
        
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; background: none; border: none; padding: 10px; }
        .hamburger span { width: 25px; height: 3px; background: #000; border-radius: 2px; transition: 0.3s; }

        .refresh-btn {
            background: var(--green); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.75rem;
        }

        .container { padding: 30px; max-width: 1500px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABELLA ANTI-SOVRAPPOSIZIONE */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 900px; }
        th { background: rgba(255,255,255,0.03); padding: 15px; text-align: left; font-size: 0.7rem; color: #8b949e; border-bottom: 2px solid var(--border); }
        
        /* FIX: white-space nowrap e overflow hidden impediscono la sovrapposizione */
        td { 
            padding: 15px; border-bottom: 1px solid var(--border); 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            font-size: 0.85rem;
        }
        
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); } .ST-VALUTAZIONE { color: var(--yellow); } .ST-RESPINTO { color: var(--red); }

        /* GRID REPORT AI */
        .ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 450px), 1fr)); gap: 25px; }
        .ai-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; border-left: 5px solid var(--purple); }
        .ai-card-body { font-size: 0.95rem; line-height: 1.7; color: #adbac7; white-space: pre-wrap; }

        /* MOBILE RESPONSIVE */
        @media (max-width: 850px) {
            .hamburger { display: flex; }
            .nav-links { 
                display: none; position: absolute; top: 70px; right: 20px; 
                background: #fff; flex-direction: column; width: 200px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-radius: 8px; padding: 10px;
            }
            .nav-links.open { display: flex; }
            .nav-btn { width: 100%; text-align: left; padding: 15px; color: #000; }
            .brand h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>ACQUISTI DIPARTIMENTO</h1>
            <p>IIS ANTONIO SCARPA</p>
        </div>
        
        <div class="nav-wrapper">
            <button class="refresh-btn" onclick="update()">SINCRO 🔄</button>
            <button class="hamburger" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links" id="menu">
                <button class="nav-btn active" onclick="switchView('tabella', this)">Lista Ordini</button>
                <button class="nav-btn" onclick="switchView('report', this)">Analisi IA</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 110px">
                        <col style="width: 180px">
                        <col style="width: 180px">
                        <col style="width: 160px">
                        <col style="width: auto">
                    </colgroup>
                    <thead>
                        <tr><th>DATA</th><th>DEPT</th><th>STATO</th><th>RESP.</th><th>OGGETTO</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        function toggleMenu() { document.getElementById('menu').classList.toggle('open'); }

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(window.innerWidth < 850) toggleMenu();
        }

        function parseCSV(text) {
            const rows = []; let curr = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        async function update() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = "ATTENDI...";
            try {
                const r = await fetch(`${CSV_URL}&nocache=${Date.now()}`);
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                
                const table = document.getElementById('tbody');
                const grid = document.getElementById('aiGrid');
                table.innerHTML = ''; grid.innerHTML = '';

                data.forEach(cols => {
                    if(cols.length >= 5) {
                        const val = {
                            date: cols[0], dept: cols[1], ai: cols[2], 
                            stat: cols[3] || 'INFO', resp: cols[4], obj: cols[5]
                        };

                        let sCls = 'ST-VALUTAZIONE';
                        if(val.stat.toUpperCase().includes('APPROVATO')) sCls = 'ST-APPROVATO';
                        if(val.stat.toUpperCase().includes('RESPINTO')) sCls = 'ST-RESPINTO';

                        // Nella tabella usiamo TITLE per mostrare il testo completo al passaggio del mouse
                        table.innerHTML += `<tr>
                            <td style="color:#8b949e">${val.date}</td>
                            <td style="font-weight:800; color:#fff">${val.dept}</td>
                            <td><span class="badge ${sCls}">${val.stat}</span></td>
                            <td>${val.resp}</td>
                            <td title="${val.obj.replace(/"/g, '&quot;')}">${val.obj}</td>
                        </tr>`;

                        if(val.ai && val.ai.trim().length > 10 && !val.ai.includes("Caricamento")) {
                            grid.innerHTML += `
                                <div class="ai-card">
                                    <h3 style="margin:0; color:#fff; font-size:1.2rem;">${val.dept}</h3>
                                    <p style="font-size:0.7rem; color:var(--purple); margin: 5px 0 15px 0; font-weight:800;">DIPARTIMENTO - ${val.date}</p>
                                    <div class="ai-card-body">${val.ai.replace(/\*\*/g, '')}</div>
                                </div>`;
                        }
                    }
                });
            } catch (e) { console.error(e); }
            btn.innerText = "SINCRO 🔄";
        }

        update();
    </script>
</body>
</html>
