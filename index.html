<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Acquisti | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; width: 100%; }

        /* HEADER */
        header { 
            background: #fff; color: #000; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            height: 70px; width: 100%;
        }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .school-logo { height: 40px; width: auto; flex-shrink: 0; }
        .brand h1 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand p { margin: 0; font-size: 0.6rem; color: #666; font-weight: 600; text-transform: uppercase; }

        /* NAV */
        .nav-wrapper { display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 5px; }
        .nav-btn { 
            padding: 8px 12px; cursor: pointer; border: none; background: transparent; 
            border-radius: 6px; font-weight: 700; color: #444; font-size: 0.7rem; text-transform: uppercase;
        }
        .nav-btn.active { color: var(--blue); background: rgba(88,166,255,0.1); }
        .nav-btn.logout { color: var(--red); }
        
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 4px; background: none; border: none; padding: 5px; }
        .hamburger span { width: 22px; height: 2px; background: #000; border-radius: 2px; transition: 0.3s; }
        
        .refresh-btn { background: var(--green); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.65rem; }

        .container { padding: 15px; width: 100%; max-width: 1400px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABELLA */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; width: 100%; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 750px; }
        th { background: rgba(255,255,255,0.03); padding: 12px 10px; text-align: left; font-size: 0.6rem; color: #8b949e; border-bottom: 1px solid var(--border); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.55rem; font-weight: 800; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); } .ST-VALUTAZIONE { color: var(--yellow); } .ST-RESPINTO { color: var(--red); }

        /* GRAFICO */
        .stats-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; width: 100%; }
        .chart-box { position: relative; height: 300px; width: 100%; }

        /* CARDS IA */
        .ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 350px), 1fr)); gap: 15px; }
        .ai-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; border-left: 4px solid var(--purple); }

        /* MOBILE FIX */
        @media (max-width: 768px) {
            header { height: 60px; padding: 0 10px; }
            .brand { display: none; } 
            .school-logo { height: 35px; }
            .hamburger { display: flex; }
            .nav-links { 
                display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
                background: #fff; flex-direction: column; align-items: center; padding-top: 30px; gap: 10px; z-index: 1000;
            }
            .nav-links.open { display: flex; }
            .nav-btn { font-size: 1.1rem; color: #000; width: 85%; text-align: center; padding: 15px; border-bottom: 1px solid #eee; }
            .nav-btn.logout { color: var(--red); border-bottom: none; }
            .chart-box { height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
            <div class="brand">
                <h1>ACQUISTI DIPARTIMENTO</h1>
                <p>IIS ANTONIO SCARPA</p>
            </div>
        </div>
        
        <div class="nav-wrapper">
            <button class="refresh-btn" onclick="update()">SINCRO 🔄</button>
            <button class="hamburger" id="hamBtn" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links" id="menu">
                <button class="nav-btn active" onclick="switchView('tabella', this)">Lista</button>
                <button class="nav-btn" onclick="switchView('report', this)">Analisi IA</button>
                <button class="nav-btn logout" onclick="logout()">ESCI ✖</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 80px"><col style="width: 120px"><col style="width: 130px"><col style="width: 120px"><col style="width: auto">
                    </colgroup>
                    <thead><tr><th>DATA</th><th>DEPT</th><th>STATO</th><th>RESP.</th><th>OGGETTO</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>

            <div class="stats-container">
                <p style="font-size: 0.65rem; color: #8b949e; text-align: center; margin-bottom: 10px; font-weight: 800; text-transform: uppercase;">Avanzamento Acquisti</p>
                <div class="chart-box"><canvas id="deptChart"></canvas></div>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        // --- 1. SICUREZZA ---
        if (localStorage.getItem('scarpa_auth') !== 'true') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('scarpa_auth');
            window.location.href = 'login.html';
        }

        // --- 2. CONFIGURAZIONE E DATI ---
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let myChart = null;

        function toggleMenu() { 
            const menu = document.getElementById('menu');
            const btn = document.getElementById('hamBtn');
            menu.classList.toggle('open');
            btn.classList.toggle('open');
            const spans = btn.querySelectorAll('span');
            if(menu.classList.contains('open')) {
                spans[0].style.transform = "translateY(6px) rotate(45deg)";
                spans[1].style.opacity = "0";
                spans[2].style.transform = "translateY(-6px) rotate(-45deg)";
            } else {
                spans[0].style.transform = "none";
                spans[1].style.opacity = "1";
                spans[2].style.transform = "none";
            }
        }

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(window.innerWidth <= 768 && document.getElementById('menu').classList.contains('open')) toggleMenu();
            if(id === 'tabella') setTimeout(() => { if(myChart) myChart.resize(); }, 50);
        }

        function parseCSV(text) {
            const rows = []; let curr = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        function renderChart(stats) {
            const ctx = document.getElementById('deptChart').getContext('2d');
            const labels = Object.keys(stats);
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'OK', data: labels.map(l => stats[l].app), backgroundColor: '#58a6ff' },
                        { label: 'WAIT', data: labels.map(l => stats[l].val), backgroundColor: '#d29922' },
                        { label: 'NO', data: labels.map(l => stats[l].res), backgroundColor: '#f85149' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: '#8b949e', font: { size: 9 } } },
                        y: { stacked: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e', font: { size: 9 } } }
                    },
                    plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9', boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        async function update() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = "...";
            try {
                const r = await fetch(`${CSV_URL}&nocache=${Date.now()}`);
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                const table = document.getElementById('tbody');
                const grid = document.getElementById('aiGrid');
                table.innerHTML = ''; grid.innerHTML = '';
                const stats = {};

                data.forEach(cols => {
                    if(cols.length >= 5) {
                        const val = { date: cols[0], dept: cols[1], ai: cols[2], stat: (cols[3] || 'INFO').toUpperCase(), resp: cols[4], obj: cols[5] };
                        if (!stats[val.dept]) stats[val.dept] = { app: 0, val: 0, res: 0 };
                        let sCls = 'ST-VALUTAZIONE';
                        if (val.stat.includes('APPROVATO')) { stats[val.dept].app++; sCls = 'ST-APPROVATO'; }
                        else if (val.stat.includes('RESPINTO')) { stats[val.dept].res++; sCls = 'ST-RESPINTO'; }
                        else { stats[val.dept].val++; }

                        table.innerHTML += `<tr><td>${val.date}</td><td style="font-weight:800; color:#fff">${val.dept}</td><td><span class="badge ${sCls}">${val.stat}</span></td><td>${val.resp}</td><td title="${val.obj}">${val.obj}</td></tr>`;
                        if(val.ai && val.ai.trim().length > 10) {
                            grid.innerHTML += `<div class="ai-card"><h3 style="margin:0; color:#fff; font-size:1rem;">${val.dept}</h3><div style="font-size:0.8rem; margin-top:10px; color:#adbac7;">${val.ai.replace(/\*\*/g, '')}</div></div>`;
                        }
                    }
                });
                renderChart(stats);
            } catch (e) { console.error(e); }
            btn.innerText = "SINCRO 🔄";
        }

        update();
        window.addEventListener('resize', () => { if(myChart) myChart.resize(); });
    </script>
</body>
</html>
