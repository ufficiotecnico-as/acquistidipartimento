<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA ACQUISTI v11.0 | IIS SCARPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        /* HEADER BIANCO */
        header { 
            background: #fff; color: #000; padding: 10px 30px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .nav-links { display: flex; gap: 10px; }
        .nav-btn { 
            padding: 10px 20px; cursor: pointer; border: none; background: transparent; 
            border-radius: 6px; font-weight: 700; color: #666; transition: 0.3s;
            text-transform: uppercase;
        }
        .nav-btn.active { color: var(--blue); border-bottom: 3px solid var(--blue); border-radius: 0; }

        .container { padding: 30px; max-width: 1600px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }

        /* TABELLA */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: rgba(255,255,255,0.03); padding: 20px 15px; text-align: left; font-size: 0.75rem; color: #8b949e; border-bottom: 2px solid var(--border); }
        td { padding: 18px 15px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* BADGES */
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); background: rgba(88,166,255,0.1); }
        .ST-VALUTAZIONE { color: var(--yellow); background: rgba(210,153,34,0.1); }
        .ST-RESPINTO { color: var(--red); background: rgba(248,81,73,0.1); }

        /* REPORT AI CARD VIEW */
        .ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 25px; }
        .ai-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 25px; border-left: 5px solid var(--purple);
        }
        .ai-card h3 { margin: 0 0 12px 0; font-size: 1.2rem; color: #fff; }
        .ai-card-body { font-size: 0.95rem; line-height: 1.7; color: #adbac7; white-space: pre-line; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size:1.2rem;">SISTEMA ACQUISTI <span style="font-weight:200;">| IIS SCARPA</span></h1>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchView('tabella', this)">Monitoraggio</button>
            <button class="nav-btn" onclick="switchView('report', this)">Report AI</button>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" height="40">
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 120px"><col style="width: 200px"><col style="width: 200px"><col style="width: 180px"><col style="width: auto">
                    </colgroup>
                    <thead>
                        <tr><th>DATA</th><th>DIPARTIMENTO</th><th>STATO</th><th>RESPONSABILE</th><th>OBIETTIVO</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // Funzione magica per leggere il CSV senza perdere colonne
        function parseCSV(text) {
            const rows = [];
            let curr = [];
            let field = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        async function update() {
            try {
                const r = await fetch(`${CSV_URL}&nocache=` + Date.now());
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                
                const table = document.getElementById('tbody');
                const grid = document.getElementById('aiGrid');
                table.innerHTML = ''; grid.innerHTML = '';

                data.forEach(cols => {
                    if(cols.length >= 5) {
                        const val = {
                            date: cols[0], dept: cols[1], ai: cols[2], 
                            stat: cols[3] || 'IN VALUTAZIONE', resp: cols[4], obj: cols[5]
                        };

                        // Tabella
                        let sCls = 'ST-VALUTAZIONE';
                        if(val.stat.toUpperCase().includes('APPROVATO')) sCls = 'ST-APPROVATO';
                        if(val.stat.toUpperCase().includes('RESPINTO')) sCls = 'ST-RESPINTO';

                        table.innerHTML += `<tr>
                            <td style="color:#6e7681">${val.date}</td>
                            <td style="font-weight:900; color:#fff">${val.dept}</td>
                            <td><span class="badge ${sCls}">${val.stat}</span></td>
                            <td style="color:#fff">${val.resp}</td>
                            <td style="color:#8b949e">${val.obj}</td>
                        </tr>`;

                        // Card AI - Controllo rigoroso per farle apparire
                        if(val.ai && val.ai.trim().length > 5 && !val.ai.includes("Caricamento")) {
                            grid.innerHTML += `
                                <div class="ai-card">
                                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                                        <span style="color:var(--purple); font-weight:800; font-size:0.7rem; text-transform:uppercase;">Analisi Groq</span>
                                        <span style="color:#666; font-size:0.7rem;">${val.date}</span>
                                    </div>
                                    <h3>${val.dept}</h3>
                                    <div class="ai-card-body">${val.ai.replace(/\*\*/g, '')}</div>
                                    <div style="margin-top:15px; border-top:1px solid var(--border); padding-top:10px; font-size:0.75rem; color:#666;">
                                        Richiedente: <strong>${val.resp}</strong>
                                    </div>
                                </div>`;
                        }
                    }
                });
            } catch (e) { console.error(e); }
        }

        update();
        setInterval(update, 20000);
    </script>
</body>
</html>
