<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordini di Dipartimento | IIS Antonio Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #030508;
            --surface: rgba(17, 25, 40, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --valutazione: #ffc107;
            --integrazione: #a855f7;
            --approvato: #3b82f6;
            --completato: #10b981;
            --respinto: #ef4444;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
            color: #fff;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        .container { max-width: 1440px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 3.5rem; font-weight: 900; margin: 0; letter-spacing: -2px; background: linear-gradient(#fff, #64748b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.1rem; letter-spacing: 6px; color: var(--text-dim); text-transform: uppercase; margin-top: 5px; font-weight: 300; }

        .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }

        .glass-panel { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 24px; padding: 25px; }

        .kpi-tile { padding: 12px 18px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid transparent; cursor: pointer; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .kpi-tile:hover { background: rgba(255,255,255,0.08); transform: translateX(8px); }
        .kpi-tile.active { background: rgba(59, 130, 246, 0.2); border-color: var(--approvato); }

        .tiles-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .order-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
        .order-tile::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        
        .t-valutazione::before { background: var(--valutazione); }
        .t-integrazione::before { background: var(--integrazione); }
        .t-approvato::before { background: var(--approvato); }
        .t-completato::before { background: var(--completato); }
        .t-respinto::before { background: var(--respinto); }

        .tile-dept { font-size: 1.3rem; font-weight: 800; margin-top: 10px; display: block; }
        .status-pill { display: inline-block; padding: 3px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 700; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
        .tile-time { display: block; margin-top: 15px; font-size: 0.7rem; color: var(--text-dim); font-family: monospace; }

        #searchInput { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 18px 25px; border-radius: 50px; color: white; font-size: 1rem; margin-bottom: 30px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Ordini di Dipartimento</h1>
        <div class="subtitle">IIS ANTONIO SCARPA</div>
    </header>

    <input type="text" id="searchInput" placeholder="Cerca dipartimento..." onkeyup="renderAll()">

    <div class="dashboard-grid">
        <aside class="glass-panel">
            <canvas id="mainChart" style="max-height: 200px; margin-bottom: 25px;"></canvas>
            <div class="kpi-tile" onclick="setFilter('IN VALUTAZIONE', this)"><span>Valutazione</span><b id="c-val" style="color:var(--valutazione)">0</b></div>
            <div class="kpi-tile" onclick="setFilter('RICHIESTA INTEGRAZIONE', this)"><span>Integrazione</span><b id="c-int" style="color:var(--integrazione)">0</b></div>
            <div class="kpi-tile" onclick="setFilter('APPROVATO - IN ORDINE', this)"><span>Approvati</span><b id="c-app" style="color:var(--approvato)">0</b></div>
            <div class="kpi-tile" onclick="setFilter('COMPLETATO / CONSEGNATO', this)"><span>Completati</span><b id="c-com" style="color:var(--completato)">0</b></div>
            <div class="kpi-tile" onclick="setFilter('RESPINTO', this)"><span>Respinti</span><b id="c-res" style="color:var(--respinto)">0</b></div>
            <button onclick="resetFilters()" style="width:100%; margin-top:15px; background:none; border:1px solid var(--border); color:var(--text-dim); padding:10px; border-radius:10px; cursor:pointer;">Reset</button>
        </aside>

        <main id="tilesGrid" class="tiles-container"></main>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
    let rawData = [], activeStatus = null, chartObj = null;

    async function loadData() {
        try {
            const r = await fetch(CSV_URL + '&t=' + Date.now());
            const text = await r.text();
            const rows = text.split('\n').slice(1);
            const unique = {};
            rows.forEach(row => {
                const c = row.split(',');
                if(c.length < 3) return;
                const d = c[1].replace(/"/g, '').trim();
                if(d) unique[d] = { dept: d, status: c[2].replace(/"/g, '').trim().toUpperCase(), time: c[0].replace(/"/g, '').trim() };
            });
            rawData = Object.values(unique);
            renderAll();
        } catch(e) { console.error(e); }
    }

    function renderAll() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = rawData.filter(o => (!activeStatus || o.status === activeStatus) && o.dept.toLowerCase().includes(query));

        const stats = { 'IN VALUTAZIONE': 0, 'RICHIESTA INTEGRAZIONE': 0, 'APPROVATO - IN ORDINE': 0, 'COMPLETATO / CONSEGNATO': 0, 'RESPINTO': 0 };
        rawData.forEach(o => { if(stats[o.status] !== undefined) stats[o.status]++; });

        ['val','int','app','com','res'].forEach((k, i) => document.getElementById('c-'+k).innerText = Object.values(stats)[i]);
        updateChart(stats);

        document.getElementById('tilesGrid').innerHTML = filtered.map(o => {
            let type = 't-valutazione';
            if(o.status.includes('INTEGRAZIONE')) type = 't-integrazione';
            if(o.status.includes('APPROVATO')) type = 't-approvato';
            if(o.status.includes('COMPLETATO')) type = 't-completato';
            if(o.status.includes('RESPINTO')) type = 't-respinto';
            return `<div class="order-tile ${type}"><span class="status-pill">${o.status}</span><span class="tile-dept">${o.dept}</span><span class="tile-time">Aggiornato: ${o.time}</span></div>`;
        }).join('');
    }

    function updateChart(s) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(chartObj) chartObj.destroy();
        chartObj = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Val', 'Int', 'App', 'Com', 'Res'], datasets: [{ data: Object.values(s), backgroundColor: ['#ffc107', '#a855f7', '#3b82f6', '#10b981', '#ef4444'], borderWidth: 0 }] },
            options: { cutout: '80%', plugins: { legend: { display: false } }, maintainAspectRatio: false }
        });
    }

    function setFilter(s, el) {
        document.querySelectorAll('.kpi-tile').forEach(t => t.classList.remove('active'));
        if(activeStatus === s) activeStatus = null;
        else { activeStatus = s; el.classList.add('active'); }
        renderAll();
    }

    function resetFilters() { activeStatus = null; document.getElementById('searchInput').value = ''; document.querySelectorAll('.kpi-tile').forEach(t => t.classList.remove('active')); renderAll(); }

    loadData();
    setInterval(loadData, 30000);
</script>
</body>
</html>
