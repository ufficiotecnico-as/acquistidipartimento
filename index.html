<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ordini | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --green: #238636;
            --blue: #1f6feb;
            --yellow: #d29922;
            --red: #da3633;
            --purple: #8957e5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(var(--border) .1em, transparent .1em), linear-gradient(90deg, var(--border) .1em, transparent .1em);
            background-size: 3em 3em;
            color: var(--text);
            padding: 40px;
            margin: 0;
        }

        /* HEADER & LOGO */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .title-group h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
            letter-spacing: -1px;
        }
        .title-group p {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #8b949e;
            margin: 5px 0 0 0;
            text-transform: uppercase;
        }
        .school-logo {
            max-height: 80px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        /* TOP CARDS */
        .top-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; 
            position: relative; overflow: hidden;
        }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        .c-green::before { background: var(--green); }
        .c-yellow::before { background: var(--yellow); }
        .c-blue::before { background: var(--blue); }
        .c-red::before { background: var(--red); }
        
        .stat-label { font-size: 0.75rem; font-weight: 600; color: #8b949e; text-transform: uppercase; }
        .stat-value { font-size: 2.5rem; font-weight: 800; display: block; margin-top: 10px; color: #fff; }

        /* CONTROLS */
        .controls { display: grid; grid-template-columns: 1fr 250px; gap: 20px; margin-bottom: 25px; }
        input, select { 
            background: var(--card); border: 1px solid var(--border); color: white; 
            padding: 12px 20px; border-radius: 8px; outline: none;
        }

        /* TABLE */
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.03); text-align: left; padding: 15px 25px; font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        td { padding: 20px 25px; border-top: 1px solid var(--border); }
        
        .dept-name { font-weight: 700; color: #fff; }
        
        .badge { 
            padding: 6px 16px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; 
            display: inline-block; border: 1px solid transparent;
        }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210, 153, 34, 0.1); }
        .b-integrazione { border-color: var(--purple); color: var(--purple); background: rgba(137, 87, 229, 0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31, 111, 235, 0.1); }
        .b-completato { border-color: var(--green); color: var(--green); background: rgba(35, 134, 54, 0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218, 54, 51, 0.1); }

        .priority-text { font-weight: 600; font-size: 0.85rem; }
        .p-alta { color: #ff4444; }
        .p-media { color: #ffbb33; }
        .p-bassa { color: #00c851; }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="title-group">
            <h1>ORDINI DI DIPARTIMENTO</h1>
            <p>IIS ANTONIO SCARPA</p>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" alt="Logo Scarpa" class="school-logo">
    </header>

    <div class="top-grid">
        <div class="stat-card c-green">
            <span class="stat-label">Dipartimenti Attivi</span>
            <span class="stat-value" id="count-total">0</span>
        </div>
        <div class="stat-card c-yellow">
            <span class="stat-label">In Valutazione</span>
            <span class="stat-value" id="count-course">0</span>
        </div>
        <div class="stat-card c-blue">
            <span class="stat-label">Approvati</span>
            <span class="stat-value" id="count-approved">0</span>
        </div>
        <div class="stat-card c-red">
            <span class="stat-label">Respinti</span>
            <span class="stat-value" id="count-blocked">0</span>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="search" placeholder="Cerca dipartimento..." onkeyup="refresh()">
        <select id="statusFilter" onchange="refresh()">
            <option value="">Tutti gli stati</option>
            <option value="IN VALUTAZIONE">In Valutazione</option>
            <option value="RICHIESTA INTEGRAZIONE">Richiesta Integrazione</option>
            <option value="APPROVATO - IN ORDINE">Approvato</option>
            <option value="COMPLETATO / CONSEGNATO">Completato</option>
            <option value="RESPINTO">Respinto</option>
        </select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Dipartimento</th>
                    <th>Stato Attuale</th>
                    <th>Priorità</th>
                    <th>Aggiornamento</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let db = [];

        async function sync() {
            try {
                const res = await fetch(CSV + '&t=' + Date.now());
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                const clean = {};
                
                rows.forEach(r => {
                    const c = r.split(',');
                    if(c.length < 3) return;
                    const d = c[1].replace(/"/g,'').trim();
                    if(d) clean[d] = {
                        name: d,
                        status: c[2].replace(/"/g,'').trim().toUpperCase(),
                        priority: c[3] ? c[3].replace(/"/g,'').trim() : 'N/D', // Prende la 4° colonna
                        time: c[0].replace(/"/g,'').trim()
                    };
                });
                db = Object.values(clean);
                refresh();
            } catch(e) { console.error("Errore sincronizzazione", e); }
        }

        function refresh() {
            const query = document.getElementById('search').value.toLowerCase();
            const filter = document.getElementById('statusFilter').value;
            const body = document.getElementById('tableBody');
            
            const filtered = db.filter(o => 
                (!filter || o.status === filter) && (o.name.toLowerCase().includes(query))
            );

            // Aggiorna contatori
            document.getElementById('count-total').innerText = db.length;
            document.getElementById('count-course').innerText = db.filter(o => o.status.includes('VALUTAZIONE')).length;
            document.getElementById('count-approved').innerText = db.filter(o => o.status.includes('APPROVATO')).length;
            document.getElementById('count-blocked').innerText = db.filter(o => o.status.includes('RESPINTO')).length;

            body.innerHTML = filtered.map(o => {
                let cls = 'b-valutazione';
                if(o.status.includes('INTEGRAZIONE')) cls = 'b-integrazione';
                if(o.status.includes('APPROVATO')) cls = 'b-approvato';
                if(o.status.includes('COMPLETATO')) cls = 'b-completato';
                if(o.status.includes('RESPINTO')) cls = 'b-respinto';

                let pCls = '';
                if(o.priority.toLowerCase() === 'alta') pCls = 'p-alta';
                if(o.priority.toLowerCase() === 'media') pCls = 'p-media';
                if(o.priority.toLowerCase() === 'bassa') pCls = 'p-bassa';

                return `<tr>
                    <td class="dept-name">${o.name}</td>
                    <td><span class="badge ${cls}">${o.status}</span></td>
                    <td class="priority-text ${pCls}">${o.priority}</td>
                    <td style="color: #8b949e; font-size: 0.8rem;">${o.time}</td>
                </tr>`;
            }).join('');
        }

        sync();
        setInterval(sync, 20000);
    </script>
</body>
</html>
