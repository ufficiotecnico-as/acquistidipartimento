<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker Dashboard - Custom Status</title>
    <style>
        :root {
            --bg-dark: #0f1216;
            --card-bg: #1a1e23;
            --accent-green: #4ade80;
            --accent-yellow: #facc15;
            --accent-blue: #3b82f6;
            --accent-red: #f87171;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --grid-color: rgba(255, 255, 255, 0.03);
            --border-ui: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-dark);
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1200px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .title-section h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #7dd3fc;
            margin: 0;
            text-transform: uppercase;
        }

        .title-section p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            letter-spacing: 2px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border-top: 4px solid #333;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            min-height: 120px;
        }

        .stat-card.attivi { border-color: var(--accent-green); }
        .stat-card.valutazione { border-color: var(--accent-yellow); }
        .stat-card.approvato { border-color: var(--accent-blue); }
        .stat-card.completato { border-color: var(--accent-red); }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .stat-value { font-size: 3rem; font-weight: 800; margin: 0; }

        /* Search & Filter */
        .search-row {
            display: grid;
            grid-template-columns: 1fr 250px;
            gap: 20px;
            margin-bottom: 25px;
        }

        input, select {
            background: #1e293b;
            border: 1px solid var(--border-ui);
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        /* Table */
        .data-list {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-ui);
            overflow: hidden;
        }

        .table-header {
            display: grid;
            grid-template-columns: 1.5fr 1.2fr 1fr;
            padding: 15px 24px;
            background: rgba(255,255,255,0.03);
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-ui);
        }

        .data-item {
            display: grid;
            grid-template-columns: 1.5fr 1.2fr 1fr;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-ui);
            transition: background 0.2s;
            align-items: center;
        }

        .data-item:hover { background: rgba(255, 255, 255, 0.05); }

        .status-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-block;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Colori dinamici Pills */
        .pill-valutazione { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .pill-approvato { border-color: var(--accent-blue); color: var(--accent-blue); }
        .pill-completato { border-color: var(--accent-green); color: var(--accent-green); }
        .pill-respinto { border-color: var(--accent-red); color: var(--accent-red); }
        .pill-integrazione { border-color: #a855f7; color: #a855f7; }

        .timestamp { color: var(--text-muted); font-size: 0.8rem; font-family: monospace; }

        @media (max-width: 850px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .search-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="title-section">
                <h1>DASHBOARD INTEGRATA GOOGLE FORM</h1>
                <p>Monitoraggio avanzamento richieste e ordini</p>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card attivi">
                <span class="stat-label">Dipartimenti Attivi</span>
                <p class="stat-value" id="count-total">0</p>
            </div>
            <div class="stat-card valutazione">
                <span class="stat-label">In Valutazione</span>
                <p class="stat-value" id="count-valutazione">0</p>
            </div>
            <div class="stat-card approvato">
                <span class="stat-label">Approvato - In Ordine</span>
                <p class="stat-value" id="count-approvato">0</p>
            </div>
            <div class="stat-card completato">
                <span class="stat-label">Completato / Consegnato</span>
                <p class="stat-value" id="count-completato">0</p>
            </div>
        </div>

        <div class="search-row">
            <input type="text" id="search" placeholder="Cerca dipartimento..." onkeyup="filterData()">
            <select id="status-filter" onchange="filterData()">
                <option value="all">Tutti gli stati</option>
                <option value="IN VALUTAZIONE">In Valutazione</option>
                <option value="RICHIESTA INTEGRAZIONE">Richiesta Integrazione</option>
                <option value="APPROVATO - IN ORDINE">Approvato - In Ordine</option>
                <option value="COMPLETATO / CONSEGNATO">Completato / Consegnato</option>
                <option value="RESPINTO">Respinto</option>
            </select>
        </div>

        <div class="data-list">
            <div class="table-header">
                <span>Dipartimento</span>
                <span>Stato Attuale</span>
                <span>Ultimo Aggiornamento</span>
            </div>
            <div id="data-container"></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let latestDataByDept = {};

        async function updateDashboard() {
            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const rows = text.split('\n').slice(1);
                
                const tempData = {};

                rows.forEach(row => {
                    const cols = row.split(',');
                    if(cols.length < 3) return;

                    const timestamp = cols[0].replace(/"/g, '').trim();
                    const dept = cols[1].replace(/"/g, '').trim();
                    const status = cols[2].replace(/"/g, '').trim().toUpperCase();

                    if (!dept) return;

                    // Sovrascrive per tenere l'ultima risposta del form
                    tempData[dept] = {
                        dept: dept,
                        status: status,
                        time: timestamp
                    };
                });

                latestDataByDept = tempData;
                renderStats();
                filterData();
            } catch (e) {
                console.error("Errore Sincronizzazione:", e);
            }
        }

        function renderStats() {
            const dataArray = Object.values(latestDataByDept);
            document.getElementById('count-total').innerText = dataArray.length;
            document.getElementById('count-valutazione').innerText = dataArray.filter(d => d.status.includes('VALUTAZIONE')).length;
            document.getElementById('count-approvato').innerText = dataArray.filter(d => d.status.includes('APPROVATO')).length;
            document.getElementById('count-completato').innerText = dataArray.filter(d => d.status.includes('COMPLETATO')).length;
        }

        function filterData() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const container = document.getElementById('data-container');
            
            const filtered = Object.values(latestDataByDept).filter(item => {
                const matchesSearch = item.dept.toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === 'all' || item.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            container.innerHTML = filtered.map(item => {
                let pillClass = '';
                if(item.status.includes('VALUTAZIONE')) pillClass = 'pill-valutazione';
                else if(item.status.includes('APPROVATO')) pillClass = 'pill-approvato';
                else if(item.status.includes('COMPLETATO')) pillClass = 'pill-completato';
                else if(item.status.includes('RESPINTO')) pillClass = 'pill-respinto';
                else if(item.status.includes('INTEGRAZIONE')) pillClass = 'pill-integrazione';

                return `
                    <div class="data-item">
                        <span style="font-weight:700; font-size: 1.1rem;">${item.dept}</span>
                        <div><span class="status-pill ${pillClass}">${item.status}</span></div>
                        <span class="timestamp">${item.time}</span>
                    </div>
                `;
            }).join('');
        }

        updateDashboard();
        setInterval(updateDashboard, 30000); 
    </script>
</body>
</html>
