<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ordini Integrale | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --yellow: #d29922; --purple: #8957e5; --blue: #1f6feb; --green: #238636; --red: #da3633;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .white-header { background-color: #ffffff; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; }
        .white-header h1 { color: #000; margin: 0; font-size: 1.4rem; font-weight: 800; }
        .school-logo { max-height: 45px; }
        .main-content { padding: 20px; width: 98%; margin: 0 auto; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; table-layout: fixed; }
        th { background: rgba(255,255,255,0.03); text-align: left; padding: 15px; color: #8b949e; text-transform: uppercase; font-size: 0.7rem; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); vertical-align: top; overflow: hidden; word-wrap: break-word; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; border: 1px solid transparent; white-space: nowrap; }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210,153,34,0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31,111,235,0.1); }
        .b-completato { border-color: var(--green); color: var(--green); background: rgba(35,134,54,0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218,54,51,0.1); }
        .timestamp { color: #666; font-family: monospace; font-size: 0.75rem; }
    </style>
</head>
<body>

    <header class="white-header">
        <h1>SISTEMA MONITORAGGIO ACQUISTI</h1>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
    </header>

    <div class="main-content">
        <div class="table-container">
            <table>
                <colgroup>
                    <col style="width: 10%"> <col style="width: 12%"> <col style="width: 12%"> <col style="width: 12%"> <col style="width: 15%"> <col style="width: 25%"> <col style="width: 14%"> </colgroup>
                <thead>
                    <tr>
                        <th>DATA (A)</th>
                        <th>DIPARTIMENTO (B)</th>
                        <th>STATO (D)</th>
                        <th>RESPONSABILE (E)</th>
                        <th>OBIETTIVO (F)</th>
                        <th>ANALISI GROQ (C)</th>
                        <th>NOTE/ALTRO (H)</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        async function syncData() {
            try {
                // Il parametro dummy 'nocache' forza il browser a scaricare il CSV nuovo
                const response = await fetch(CSV_URL + '&nocache=' + new Date().getTime());
                const text = await response.text();
                const rows = text.split(/\r?\n/).slice(1);
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                rows.forEach(row => {
                    // Split corretto per CSV che ignora le virgole dentro i doppi apici
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    // Verifichiamo che la riga non sia vuota e abbia le colonne necessarie
                    if(c.length >= 6 && c[1] && c[1].trim() !== "") {
                        const tr = document.createElement('tr');
                        
                        // Pulizia dei dati dalle virgolette di Excel
                        const clean = (val) => (val || "").replace(/^"|"$/g, '').trim();

                        const dataA = clean(c[0]); // Timestamp
                        const deptB = clean(c[1]); // Dipartimento
                        const aiC   = clean(c[2]); // Analisi Groq
                        const statD = clean(c[3]); // STATO
                        const respE = clean(c[4]); // Responsabile
                        const objF  = clean(c[5]); // Obiettivo
                        const noteH = clean(c[7]); // Note (Colonna H è indice 7)

                        // Logica Colori Stato
                        let badgeClass = 'b-valutazione';
                        const s = statD.toUpperCase();
                        if(s.includes('APPROVATO')) badgeClass = 'b-approvato';
                        else if(s.includes('COMPLETATO')) badgeClass = 'b-completato';
                        else if(s.includes('RESPINTO')) badgeClass = 'b-respinto';

                        tr.innerHTML = `
                            <td class="timestamp">${dataA}</td>
                            <td style="font-weight:800; color:#fff;">${deptB}</td>
                            <td><span class="badge ${badgeClass}">${statD}</span></td>
                            <td style="color:#fff;">${respE}</td>
                            <td style="font-size: 0.8rem; color:#c9d1d9;">${objF}</td>
                            <td style="font-size: 0.75rem; color:var(--purple); line-height:1.2;">${aiC}</td>
                            <td style="color:#8b949e; font-size: 0.8rem;">${noteH}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });
            } catch (e) { console.error("Errore critico sync:", e); }
        }

        // Carica subito e poi ogni 15 secondi
        syncData();
        setInterval(syncData, 15000);
    </script>
</body>
</html>
