<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ordini v5.0 | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --yellow: #d29922; --purple: #8957e5; --blue: #1f6feb; --green: #238636; --red: #da3633;
        }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); 
            margin: 0; padding: 0; overflow-x: hidden;
        }
        .white-header {
            background-color: #ffffff; padding: 15px 40px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 100;
        }
        .white-header h1 { color: #000; margin: 0; font-size: 1.8rem; font-weight: 800; }
        .school-logo { max-height: 60px; }
        .main-content { padding: 40px; max-width: 1500px; margin: 0 auto; }
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.02); text-align: left; padding: 20px; font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        td { padding: 20px; border-top: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        tr:hover td { background: rgba(255,255,255,0.04); }
        .dept-name { font-weight: 800; color: #fff; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; border: 1px solid transparent; }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210,153,34,0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31,111,235,0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218,54,51,0.1); }
        
        .side-drawer {
            position: fixed; top: 0; right: -550px; width: 500px; height: 100%;
            background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); z-index: 1000;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 40px; overflow-y: auto;
        }
        .side-drawer.open { right: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 999; }
        .ai-box { background: rgba(137, 87, 229, 0.05); border: 1px solid rgba(137, 87, 229, 0.3); border-radius: 16px; padding: 20px; margin-top: 20px; }
        .detail-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; margin-top: 20px; display: block; font-weight: 600; }
        .detail-value { color: #fff; font-size: 1.1rem; font-weight: 600; display: block; margin-top: 5px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; position: absolute; top: 20px; right: 20px; }
    </style>
</head>
<body>
    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
    <div class="side-drawer" id="drawer">
        <button class="close-btn" onclick="closeDrawer()">✕</button>
        <span id="d-status" class="badge">STATO</span>
        <h2 id="d-name" style="color: #fff; font-size: 2rem; margin: 15px 0;">Dipartimento</h2>
        
        <span class="detail-label">Docente Richiedente</span>
        <span id="d-docente" class="detail-value">-</span>

        <span class="detail-label">Oggetto / Specifiche Ordine</span>
        <div id="d-specs" style="color: #adbac7; line-height: 1.6; margin-top: 10px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 10px;">-</div>

        <div class="ai-box">
            <div style="color: var(--purple); font-weight: 800; font-size: 0.75rem; margin-bottom: 10px;">ANALISI INTELLIGENTE GROQ</div>
            <div id="d-ai" style="font-size: 0.9rem; line-height: 1.5; color: #e6edf3;">-</div>
        </div>
        <p id="d-time" style="color: #666; font-size: 0.8rem; margin-top: 30px;"></p>
    </div>

    <header class="white-header">
        <div><h1>ORDINI DI DIPARTIMENTO</h1><p style="color:#666; margin:0; font-size:0.8rem;">IIS ANTONIO SCARPA</p></div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
    </header>

    <div class="main-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Dipartimento</th>
                        <th>Stato</th>
                        <th>Docente</th>
                        <th>Oggetto Acquisto</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let db = [];

        async function sync() {
            try {
                const res = await fetch(CSV + '&t=' + Date.now());
                const text = await res.text();
                const rows = text.split(/\r?\n/).slice(1);
                db = [];
                rows.forEach(r => {
                    const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(c.length < 5) return;
                    
                    // MAPPATURA CORRETTA BASATA SUL TUO CSV
                    db.push({
                        time: (c[0]||"").replace(/"/g,'').trim(),     // A: Timestamp
                        dept: (c[1]||"N/D").replace(/"/g,'').trim(),  // B: Dipartimento
                        ai: (c[2]||"Analisi non disponibile").replace(/"/g,'').trim(), // C: AI Groq
                        status: (c[3]||"VALUTAZIONE").replace(/"/g,'').trim().toUpperCase(), // D: Stato Pratica
                        docente: (c[4]||"N/D").replace(/"/g,'').trim(), // E: Docente (Responsabile)
                        oggetto: (c[5]||"").replace(/"/g,'').trim()    // F: Descrizione Obiettivo
                    });
                });
                render();
            } catch(e) { console.error(e); }
        }

        function render() {
            const body = document.getElementById('tableBody');
            body.innerHTML = db.map((o, index) => {
                let cls = o.status.includes('APPROVATO') ? 'b-approvato' : o.status.includes('RESPINTO') ? 'b-respinto' : 'b-valutazione';
                return `<tr onclick="openDrawer(${index})">
                    <td class="dept-name">${o.dept}</td>
                    <td><span class="badge ${cls}">${o.status}</span></td>
                    <td style="color:#fff;">${o.docente}</td>
                    <td style="color:#8b949e; font-size:0.9rem;">${o.oggetto.substring(0, 50)}...</td>
                    <td style="color:#666; font-size:0.8rem;">${o.time}</td>
                </tr>`;
            }).join('');
        }

        function openDrawer(index) {
            const data = db[index];
            if(!data) return;
            
            document.getElementById('d-name').innerText = data.dept;
            document.getElementById('d-status').innerText = data.status;
            document.getElementById('d-status').className = 'badge ' + (data.status.includes('APPROVATO') ? 'b-approvato' : data.status.includes('RESPINTO') ? 'b-respinto' : 'b-valutazione');
            document.getElementById('d-docente').innerText = data.docente;
            document.getElementById('d-specs').innerText = data.oggetto;
            document.getElementById('d-ai').innerText = data.ai;
            document.getElementById('d-time').innerText = "Inviato il: " + data.time;
            
            document.getElementById('drawer').classList.add('open');
            document.getElementById('overlay').style.display = 'block';
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
