<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Acquisti | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; width: 100%; }

        /* HEADER */
        header { 
            background: #fff; color: #000; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1001; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            height: 70px; width: 100%;
        }
        .header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .school-logo { height: 40px; width: auto; flex-shrink: 0; }
        .brand h1 { margin: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px; }
        .brand p { margin: 0; font-size: 0.6rem; color: #666; font-weight: 600; text-transform: uppercase; }

        /* NAV */
        .nav-wrapper { display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 5px; }
        .nav-btn { padding: 8px 12px; cursor: pointer; border: none; background: transparent; border-radius: 6px; font-weight: 700; color: #444; font-size: 0.7rem; text-transform: uppercase; }
        .nav-btn.active { color: var(--blue); background: rgba(88,166,255,0.1); }
        .nav-btn.logout { color: var(--red); }
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 4px; background: none; border: none; }
        .hamburger span { width: 22px; height: 2px; background: #000; border-radius: 2px; transition: 0.3s; }
        .refresh-btn { background: var(--green); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.65rem; }

        .container { padding: 15px; width: 100%; max-width: 1400px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABELLA RIDOTTA (4 COLONNE + AZIONI) */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; margin-bottom: 20px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: rgba(255,255,255,0.03); padding: 12px 10px; text-align: left; font-size: 0.6rem; color: #8b949e; border-bottom: 1px solid var(--border); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.55rem; font-weight: 800; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); } .ST-VALUTAZIONE { color: var(--yellow); } .ST-RESPINTO { color: var(--red); }

        /* BOTTONE AZIONI */
        .btn-action { background: var(--border); color: #fff; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.65rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: var(--blue); }

        /* MODAL POPUP */
        .modal { 
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); align-items: center; justify-content: center; 
        }
        .modal-content { 
            background: var(--card); border: 1px solid var(--border); width: 90%; max-width: 500px; 
            padding: 25px; border-radius: 15px; position: relative; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
        .modal-close { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 1.5rem; color: #8b949e; }
        .modal-body p { margin: 10px 0; font-size: 0.9rem; line-height: 1.4; }
        .modal-label { color: #8b949e; font-size: 0.7rem; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 2px; }

        /* STATS */
        .stats-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; width: 100%; }
        .chart-box { position: relative; height: 300px; width: 100%; }

        /* MOBILE FIX */
        @media (max-width: 768px) {
            header { height: 60px; padding: 0 10px; }
            .brand { display: none; } 
            .school-logo { height: 35px; }
            .hamburger { display: flex; }
            .nav-links { display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: #fff; flex-direction: column; align-items: center; padding-top: 30px; z-index: 1000; }
            .nav-links.open { display: flex; }
            .nav-btn { font-size: 1.1rem; color: #000; width: 85%; text-align: center; padding: 15px; border-bottom: 1px solid #eee; }
            
            /* Colonne tabella su mobile */
            th:nth-child(4), td:nth-child(4) { display: none; } /* Nascondiamo 'Responsabile' su schermi piccolissimi per far stare il resto */
            table { min-width: auto; }
        }
    </style>
</head>
<body>

    <div id="infoModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2 id="m-dept" style="margin:0; color:var(--blue)">Dipartimento</h2>
                <div id="m-status" style="margin-top:5px"></div>
            </div>
            <div class="modal-body">
                <span class="modal-label">Oggetto Acquisto</span>
                <p id="m-obj" style="color:#fff; font-weight:600"></p>
                <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                <span class="modal-label">Analisi Intelligenza Artificiale</span>
                <p id="m-ai" style="color:var(--purple); font-style: italic;"></p>
                <div style="margin-top:20px; font-size:0.75rem; color:#8b949e">
                    Richiesto da: <span id="m-resp" style="color:#fff"></span> in data <span id="m-date" style="color:#fff"></span>
                </div>
            </div>
        </div>
    </div>

    <header>
        <div class="header-left">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
            <div class="brand"><h1>ACQUISTI DIPARTIMENTO</h1><p>IIS ANTONIO SCARPA</p></div>
        </div>
        <div class="nav-wrapper">
            <button class="refresh-btn" onclick="update()">SINCRO 🔄</button>
            <button class="hamburger" id="hamBtn" onclick="toggleMenu()"><span></span><span></span><span></span></button>
            <nav class="nav-links" id="menu">
                <button class="nav-btn active" onclick="switchView('tabella', this)">Lista</button>
                <button class="nav-btn logout" onclick="logout()">ESCI ✖</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 80px"><col style="width: 100px"><col style="width: 110px"><col style="width: 110px"><col style="width: 70px">
                    </colgroup>
                    <thead><tr><th>DATA</th><th>DEPT</th><th>STATO</th><th>RESP.</th><th>INFO</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="stats-container">
                <p style="font-size: 0.65rem; color: #8b949e; text-align: center; margin-bottom: 10px; font-weight: 800; text-transform: uppercase;">Avanzamento Acquisti</p>
                <div class="chart-box"><canvas id="deptChart"></canvas></div>
            </div>
        </div>
    </div>

    <script>
        // --- SICUREZZA ---
        if (localStorage.getItem('scarpa_auth') !== 'true') { window.location.href = 'login.html'; }
        function logout() { localStorage.removeItem('scarpa_auth'); window.location.href = 'login.html'; }

        // --- DATI ---
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let myChart = null;
        let allData = [];

        function toggleMenu() { 
            const menu = document.getElementById('menu');
            const btn = document.getElementById('hamBtn');
            menu.classList.toggle('open');
            btn.classList.toggle('open');
        }

        function openModal(index) {
            const item = allData[index];
            document.getElementById('m-dept').innerText = item.dept;
            document.getElementById('m-status').innerHTML = `<span class="badge ${item.sCls}">${item.stat}</span>`;
            document.getElementById('m-obj').innerText = item.obj;
            document.getElementById('m-ai').innerText = item.ai && item.ai.length > 5 ? item.ai.replace(/\*\*/g, '') : "Nessuna analisi disponibile per questa richiesta.";
            document.getElementById('m-resp').innerText = item.resp;
            document.getElementById('m-date').innerText = item.date;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('infoModal').style.display = 'none'; }

        window.onclick = function(event) { if (event.target == document.getElementById('infoModal')) closeModal(); }

        function parseCSV(text) {
            const rows = []; let curr = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        async function update() {
            try {
                const r = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                const table = document.getElementById('tbody');
                table.innerHTML = '';
                allData = [];
                const stats = {};

                data.forEach((cols, index) => {
                    if(cols.length >= 5) {
                        const statRaw = (cols[3] || 'INFO').toUpperCase();
                        let sCls = 'ST-VALUTAZIONE';
                        if (statRaw.includes('APPROVATO')) sCls = 'ST-APPROVATO';
                        else if (statRaw.includes('RESPINTO')) sCls = 'ST-RESPINTO';

                        const item = { 
                            date: cols[0], dept: cols[1], ai: cols[2], 
                            stat: statRaw, resp: cols[4], obj: cols[5], sCls: sCls 
                        };
                        allData.push(item);
                        
                        if (!stats[item.dept]) stats[item.dept] = { app: 0, val: 0, res: 0 };
                        if (sCls === 'ST-APPROVATO') stats[item.dept].app++;
                        else if (sCls === 'ST-RESPINTO') stats[item.dept].res++;
                        else stats[item.dept].val++;

                        table.innerHTML += `<tr>
                            <td>${item.date}</td>
                            <td style="font-weight:800; color:#fff">${item.dept}</td>
                            <td><span class="badge ${sCls}">${item.stat}</span></td>
                            <td>${item.resp}</td>
                            <td><button class="btn-action" onclick="openModal(${index})">APRI</button></td>
                        </tr>`;
                    }
                });
                renderChart(stats);
            } catch (e) { console.error(e); }
        }

        function renderChart(stats) {
            const ctx = document.getElementById('deptChart').getContext('2d');
            const labels = Object.keys(stats);
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'OK', data: labels.map(l => stats[l].app), backgroundColor: '#58a6ff' },
                        { label: 'WAIT', data: labels.map(l => stats[l].val), backgroundColor: '#d29922' },
                        { label: 'NO', data: labels.map(l => stats[l].res), backgroundColor: '#f85149' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true, ticks: { color: '#8b949e', font: { size: 9 } } },
                        y: { stacked: true, ticks: { color: '#8b949e', font: { size: 9 } } }
                    },
                    plugins: { legend: { position: 'bottom', labels: { color: '#c9d1d9', font: { size: 10 } } } }
                }
            });
        }

        update();
    </script>
</body>
</html>
