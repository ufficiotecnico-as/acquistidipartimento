<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acquisti Dipartimento | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }

        header { 
            background: #fff; color: #000; padding: 0 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1001; box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            height: 80px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .school-logo { height: 45px; width: auto; }
        .brand h1 { margin: 0; font-size: 1.1rem; font-weight: 800; }
        .brand p { margin: 0; font-size: 0.65rem; color: #666; font-weight: 600; text-transform: uppercase; }

        .nav-wrapper { display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 5px; }
        .nav-btn { padding: 8px 12px; cursor: pointer; border: none; background: transparent; border-radius: 6px; font-weight: 700; color: #444; font-size: 0.75rem; text-transform: uppercase; }
        .nav-btn.active { color: var(--blue); background: rgba(88,166,255,0.1); }
        
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; background: none; border: none; padding: 10px; }
        .hamburger span { width: 22px; height: 2px; background: #000; border-radius: 2px; transition: 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

        .refresh-btn { background: var(--green); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7rem; }

        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* SEZIONE GRAFICO */
        .stats-container { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; margin-top: 25px; display: flex; flex-direction: column; align-items: center;
        }
        .chart-box { width: 100%; max-width: 800px; height: 400px; position: relative; }

        /* TABELLA */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 800px; }
        th { background: rgba(255,255,255,0.03); padding: 12px; text-align: left; font-size: 0.65rem; color: #8b949e; border-bottom: 2px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.8rem; }
        
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 0.6rem; font-weight: 800; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); } .ST-VALUTAZIONE { color: var(--yellow); } .ST-RESPINTO { color: var(--red); }

        .ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 15px; }
        .ai-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; border-left: 4px solid var(--purple); }

        @media (max-width: 900px) {
            .hamburger { display: flex; }
            .nav-links { display: none; position: fixed; top: 80px; left: 0; right: 0; bottom: 0; background: #fff; flex-direction: column; align-items: center; padding-top: 40px; z-index: 1000; }
            .nav-links.open { display: flex; }
            .nav-btn { font-size: 1.2rem; color: #000; width: 80%; text-align: center; padding: 20px; }
            .chart-box { height: 300px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
            <div class="brand">
                <h1>ACQUISTI DIPARTIMENTO</h1>
                <p>IIS ANTONIO SCARPA</p>
            </div>
        </div>
        
        <div class="nav-wrapper">
            <button class="refresh-btn" onclick="update()">SINCRO 🔄</button>
            <button class="hamburger" id="hamBtn" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav-links" id="menu">
                <button class="nav-btn active" onclick="switchView('tabella', this)">Lista Ordini</button>
                <button class="nav-btn" onclick="switchView('report', this)">Analisi IA</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup><col style="width: 90px"><col style="width: 150px"><col style="width: 140px"><col style="width: 140px"><col style="width: auto"></colgroup>
                    <thead><tr><th>DATA</th><th>DEPT</th><th>STATO</th><th>RESP.</th><th>OGGETTO</th></tr></thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>

            <div class="stats-container">
                <h2 style="font-size: 1rem; color: #fff; margin-bottom: 20px;">📊 Distribuzione Richieste per Dipartimento</h2>
                <div class="chart-box">
                    <canvas id="deptChart"></canvas>
                </div>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let myChart = null;

        function toggleMenu() { 
            document.getElementById('menu').classList.toggle('open'); 
            document.getElementById('hamBtn').classList.toggle('open');
        }

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if(window.innerWidth <= 900) toggleMenu();
        }

        function parseCSV(text) {
            const rows = []; let curr = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        function updateChart(stats) {
            const ctx = document.getElementById('deptChart').getContext('2d');
            const labels = Object.keys(stats);
            const dataValues = Object.values(stats);

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Numero Richieste',
                        data: dataValues,
                        backgroundColor: '#58a6ffaa',
                        borderColor: '#58a6ff',
                        borderWidth: 2,
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { backgroundColor: '#161b22', titleColor: '#fff', bodyColor: '#ccc' }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } },
                        x: { grid: { display: false }, ticks: { color: '#8b949e' } }
                    }
                }
            });
        }

        async function update() {
            const btn = document.querySelector('.refresh-btn');
            btn.innerText = "...";
            try {
                const r = await fetch(`${CSV_URL}&t=${Date.now()}`);
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                
                const table = document.getElementById('tbody');
                const grid = document.getElementById('aiGrid');
                table.innerHTML = ''; grid.innerHTML = '';
                
                const deptStats = {};

                data.forEach(cols => {
                    if(cols.length >= 5) {
                        const val = { date: cols[0], dept: cols[1], ai: cols[2], stat: cols[3] || 'INFO', resp: cols[4], obj: cols[5] };
                        
                        // Conteggio per grafico
                        deptStats[val.dept] = (deptStats[val.dept] || 0) + 1;

                        let sCls = 'ST-VALUTAZIONE';
                        if(val.stat.toUpperCase().includes('APPROVATO')) sCls = 'ST-APPROVATO';
                        if(val.stat.toUpperCase().includes('RESPINTO')) sCls = 'ST-RESPINTO';

                        table.innerHTML += `<tr><td style="color:#8b949e">${val.date}</td><td style="font-weight:800; color:#fff">${val.dept}</td><td><span class="badge ${sCls}">${val.stat}</span></td><td>${val.resp}</td><td title="${val.obj}">${val.obj}</td></tr>`;

                        if(val.ai && val.ai.trim().length > 10 && !val.ai.includes("Caricamento")) {
                            grid.innerHTML += `<div class="ai-card"><h3 style="margin:0; color:#fff;">${val.dept}</h3><p style="color:var(--purple); font-size:0.6rem; font-weight:800;">${val.date}</p><div style="font-size:0.85rem; line-height:1.6; white-space:pre-wrap;">${val.ai.replace(/\*\*/g, '')}</div></div>`;
                        }
                    }
                });
                updateChart(deptStats);
            } catch (e) { console.error(e); }
            btn.innerText = "SINCRO 🔄";
        }
        update();
    </script>
</body>
</html>
