<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Scarpa v12.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }

        /* HEADER RESPONSIVE */
        header { 
            background: #fff; color: #000; padding: 10px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            flex-wrap: wrap; gap: 10px;
        }
        .nav-links { display: flex; gap: 5px; }
        .nav-btn { 
            padding: 8px 15px; cursor: pointer; border: none; background: transparent; 
            border-radius: 6px; font-weight: 700; color: #666; font-size: 0.8rem;
            text-transform: uppercase;
        }
        .nav-btn.active { color: var(--blue); background: rgba(88,166,255,0.1); }

        .container { padding: 15px; max-width: 1400px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABELLA RESPONSIVE */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; } /* Impedisce lo schiacciamento su mobile */
        th { background: rgba(255,255,255,0.03); padding: 15px; text-align: left; font-size: 0.7rem; color: #8b949e; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        /* BADGES */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; border: 1px solid currentColor; }
        .ST-APPROVATO { color: var(--blue); }
        .ST-VALUTAZIONE { color: var(--yellow); }
        .ST-RESPINTO { color: var(--red); }

        /* REPORT AI AUTO-ADATTIVI */
        .ai-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); 
            gap: 20px; 
        }
        .ai-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; border-top: 4px solid var(--purple);
        }
        .ai-card-body { font-size: 0.9rem; line-height: 1.6; color: #adbac7; white-space: pre-wrap; }

        /* MOBILE FIX */
        @media (max-width: 600px) {
            header { justify-content: center; text-align: center; }
            .nav-links { width: 100%; justify-content: center; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1 style="margin:0; font-size:1rem; font-weight:900;">DASHBOARD ACQUISTI</h1>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchView('tabella', this)">Lista</button>
            <button class="nav-btn" onclick="switchView('report', this)">Analisi AI</button>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" height="30">
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table id="mainTable">
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>DIPARTIMENTO</th>
                            <th>STATO</th>
                            <th>RESPONSABILE</th>
                            <th>OGGETTO</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // PARSER PROFESSIONALE
        function parseCSV(text) {
            const rows = []; let curr = []; let field = ''; let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i], next = text[i+1];
                if (char === '"' && inQuotes && next === '"') { field += '"'; i++; }
                else if (char === '"') { inQuotes = !inQuotes; }
                else if (char === ',' && !inQuotes) { curr.push(field); field = ''; }
                else if (char === '\n' && !inQuotes) { curr.push(field); rows.push(curr); curr = []; field = ''; }
                else { field += char; }
            }
            if (field || curr.length > 0) { curr.push(field); rows.push(curr); }
            return rows;
        }

        async function update() {
            try {
                // FETCH CON CACHE-KILLER ESTREMO
                const r = await fetch(`${CSV_URL}&nocache=${Date.now()}`, {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
                });
                const csvText = await r.text();
                const data = parseCSV(csvText).slice(1);
                
                const table = document.getElementById('tbody');
                const grid = document.getElementById('aiGrid');
                table.innerHTML = ''; grid.innerHTML = '';

                data.forEach(cols => {
                    if(cols.length >= 5) {
                        const val = {
                            date: cols[0], dept: cols[1], ai: cols[2], 
                            stat: cols[3] || 'IN ATTESA', resp: cols[4], obj: cols[5]
                        };

                        // TABLE
                        let sCls = 'ST-VALUTAZIONE';
                        if(val.stat.toUpperCase().includes('APPROVATO')) sCls = 'ST-APPROVATO';
                        if(val.stat.toUpperCase().includes('RESPINTO')) sCls = 'ST-RESPINTO';

                        table.innerHTML += `<tr>
                            <td style="color:#666; font-size:0.75rem">${val.date}</td>
                            <td style="font-weight:700; color:#fff">${val.dept}</td>
                            <td><span class="badge ${sCls}">${val.stat}</span></td>
                            <td style="color:#fff">${val.resp}</td>
                            <td style="color:#8b949e; font-size:0.8rem">${val.obj}</td>
                        </tr>`;

                        // AI CARDS
                        if(val.ai && val.ai.trim().length > 10 && !val.ai.includes("Caricamento")) {
                            grid.innerHTML += `
                                <div class="ai-card">
                                    <div style="font-size:0.7rem; color:var(--purple); font-weight:800; margin-bottom:10px;">ANALISI DIPARTIMENTO</div>
                                    <h3 style="margin:0; color:#fff;">${val.dept}</h3>
                                    <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
                                    <div class="ai-card-body">${val.ai.replace(/\*\*/g, '')}</div>
                                </div>`;
                        }
                    }
                });
            } catch (e) { console.error("Errore Sync:", e); }
        }

        update();
        setInterval(update, 15000); // Sincronizza ogni 15 secondi
    </script>
</body>
</html>
