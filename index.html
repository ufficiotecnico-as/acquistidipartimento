<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracker Pro | Elite Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --glass: rgba(22, 27, 34, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-valutazione: #ffc107;
            --accent-integrazione: #a855f7;
            --accent-approvato: #3b82f6;
            --accent-completato: #10b981;
            --accent-respinto: #ef4444;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 20px; }

        .hero-title h1 { font-size: 2.2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }
        .hero-title p { color: var(--text-dim); margin: 5px 0 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; }

        .sync-status { background: var(--glass); padding: 10px 20px; border-radius: 50px; border: 1px solid var(--glass-border); font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
        .dot { width: 8px; height: 8px; background: var(--accent-completato); border-radius: 50%; box-shadow: 0 0 10px var(--accent-completato); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .kpi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--glass); border: 1px solid var(--glass-border); padding: 20px; border-radius: 16px; cursor: pointer; transition: all 0.3s ease; }
        .kpi-card:hover { transform: translateY(-5px); border-color: rgba(255, 255, 255, 0.3); }
        .kpi-card.active { border: 2px solid var(--accent-approvato); background: rgba(59, 130, 246, 0.1); }
        .kpi-label { font-size: 0.65rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; }
        .kpi-value { font-size: 2rem; font-weight: 800; display: block; margin-top: 5px; }

        .viz-row { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 25px; }
        .viz-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; height: 320px; }

        .data-section { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; }
        .table-controls { padding: 20px; display: flex; gap: 15px; border-bottom: 1px solid var(--glass-border); }
        #searchInput { flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); padding: 12px; border-radius: 10px; color: white; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px 20px; font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); }
        .dept-cell { font-weight: 600; font-size: 1.05rem; }
        
        .pill { padding: 5px 12px; border-radius: 50px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; border: 1px solid transparent; }
        .p-valutazione { background: rgba(255, 193, 7, 0.1); color: var(--accent-valutazione); border-color: var(--accent-valutazione); }
        .p-integrazione { background: rgba(168, 85, 247, 0.1); color: var(--accent-integrazione); border-color: var(--accent-integrazione); }
        .p-approvato { background: rgba(59, 130, 246, 0.1); color: var(--accent-approvato); border-color: var(--accent-approvato); }
        .p-completato { background: rgba(16, 185, 129, 0.1); color: var(--accent-completato); border-color: var(--accent-completato); }
        .p-respinto { background: rgba(239, 68, 68, 0.1); color: var(--accent-respinto); border-color: var(--accent-respinto); }

        .time-cell { color: var(--text-dim); font-size: 0.8rem; font-family: monospace; }
        button { background: #1f2937; border: 1px solid var(--glass-border); color: white; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="hero-title">
            <h1>ORDER TRACKER ELITE</h1>
            <p>Analysis & Workflow Control</p>
        </div>
        <div class="sync-status"><div class="dot"></div><span id="sync-time">Inizializzazione...</span></div>
    </header>

    <div class="kpi-grid">
        <div class="kpi-card" onclick="setFilter('IN VALUTAZIONE', this)"><span class="kpi-label">In Valutazione</span><span class="kpi-value" id="count-val">0</span></div>
        <div class="kpi-card" onclick="setFilter('RICHIESTA INTEGRAZIONE', this)"><span class="kpi-label">Integrazione</span><span class="kpi-value" id="count-int">0</span></div>
        <div class="kpi-card" onclick="setFilter('APPROVATO - IN ORDINE', this)"><span class="kpi-label">Approvati</span><span class="kpi-value" id="count-app">0</span></div>
        <div class="kpi-card" onclick="setFilter('COMPLETATO / CONSEGNATO', this)"><span class="kpi-label">Completati</span><span class="kpi-value" id="count-com">0</span></div>
        <div class="kpi-card" onclick="setFilter('RESPINTO', this)"><span class="kpi-label">Respinti</span><span class="kpi-value" id="count-res">0</span></div>
    </div>

    <div class="viz-row">
        <div class="viz-card"><canvas id="statusChart"></canvas></div>
        <div class="viz-card"><canvas id="deptChart"></canvas></div>
    </div>

    <div class="data-section">
        <div class="table-controls">
            <input type="text" id="searchInput" placeholder="Cerca per dipartimento..." onkeyup="renderTable()">
            <button onclick="resetFilters()">Reset</button>
        </div>
        <table>
            <thead>
                <tr><th width="40%">Dipartimento</th><th width="30%">Stato</th><th width="30%">Informazioni Cronologiche</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
    let orders = [], activeFilter = null, statusChart, deptChart;

    async function sync() {
        try {
            const res = await fetch(CSV_URL + '&cb=' + Date.now());
            const text = await res.text();
            const lines = text.split('\n').slice(1);
            const mapping = {};
            lines.forEach(l => {
                const c = l.split(',');
                if(c.length < 3) return;
                const d = c[1].replace(/"/g, '').trim();
                if(!d) return;
                mapping[d] = { dept: d, status: c[2].replace(/"/g, '').trim().toUpperCase(), time: c[0].replace(/"/g, '').trim() };
            });
            orders = Object.values(mapping);
            updateUI();
            document.getElementById('sync-time').innerText = 'Aggiornato: ' + new Date().toLocaleTimeString();
        } catch (e) { console.error(e); }
    }

    function updateUI() {
        const stats = {
            'IN VALUTAZIONE': orders.filter(o => o.status === 'IN VALUTAZIONE').length,
            'RICHIESTA INTEGRAZIONE': orders.filter(o => o.status === 'RICHIESTA INTEGRAZIONE').length,
            'APPROVATO - IN ORDINE': orders.filter(o => o.status === 'APPROVATO - IN ORDINE').length,
            'COMPLETATO / CONSEGNATO': orders.filter(o => o.status === 'COMPLETATO / CONSEGNATO').length,
            'RESPINTO': orders.filter(o => o.status === 'RESPINTO').length
        };

        document.getElementById('count-val').innerText = stats['IN VALUTAZIONE'];
        document.getElementById('count-int').innerText = stats['RICHIESTA INTEGRAZIONE'];
        document.getElementById('count-app').innerText = stats['APPROVATO - IN ORDINE'];
        document.getElementById('count-com').innerText = stats['COMPLETATO / CONSEGNATO'];
        document.getElementById('count-res').innerText = stats['RESPINTO'];

        updateCharts(stats);
        renderTable();
    }

    function updateCharts(stats) {
        if(statusChart) statusChart.destroy();
        statusChart = new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(stats),
                datasets: [{ data: Object.values(stats), backgroundColor: ['#ffc107', '#a855f7', '#3b82f6', '#10b981', '#ef4444'], borderWidth: 0 }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8b949e', font: { size: 9 } } } } }
        });

        const depts = {};
        orders.forEach(o => depts[o.dept] = (depts[o.dept] || 0) + 1);
        if(deptChart) deptChart.destroy();
        deptChart = new Chart(document.getElementById('deptChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(depts),
                datasets: [{ label: 'Richieste', data: Object.values(depts), backgroundColor: '#3b82f6', borderRadius: 5 }]
            },
            options: { maintainAspectRatio: false, scales: { y: { ticks: { color: '#8b949e' } }, x: { ticks: { color: '#8b949e' } } }, plugins: { legend: { display: false } } }
        });
    }

    function setFilter(s, el) {
        document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active'));
        if(activeFilter === s) { activeFilter = null; } 
        else { activeFilter = s; el.classList.add('active'); }
        renderTable();
    }

    function resetFilters() { activeFilter = null; document.getElementById('searchInput').value = ''; document.querySelectorAll('.kpi-card').forEach(c => c.classList.remove('active')); renderTable(); }

    function renderTable() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const f = orders.filter(o => (!activeFilter || o.status === activeFilter) && o.dept.toLowerCase().includes(q));
        document.getElementById('tableBody').innerHTML = f.map(o => {
            let cls = 'p-valutazione';
            if(o.status.includes('INTEGRAZIONE')) cls = 'p-integrazione';
            if(o.status.includes('APPROVATO')) cls = 'p-approvato';
            if(o.status.includes('COMPLETATO')) cls = 'p-completato';
            if(o.status.includes('RESPINTO')) cls = 'p-respinto';
            return `<tr><td class="dept-cell">${o.dept}</td><td><span class="pill ${cls}">${o.status}</span></td><td class="time-cell">${o.time}</td></tr>`;
        }).join('');
    }

    sync();
    setInterval(sync, 30000);
</script>
</body>
</html>
</html>
