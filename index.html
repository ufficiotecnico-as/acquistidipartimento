<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SISTEMA MONITORAGGIO | IIS SCARPA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --blue: #58a6ff; --purple: #bc8cff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; }

        /* HEADER FISSO */
        header { 
            background: #fff; color: #000; padding: 10px 30px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 999; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .nav-links { display: flex; gap: 20px; }
        .nav-btn { 
            padding: 10px 20px; cursor: pointer; border: none; background: #eee; 
            border-radius: 6px; font-weight: 700; transition: 0.3s;
        }
        .nav-btn.active { background: var(--blue); color: #fff; }

        .container { padding: 30px; max-width: 1600px; margin: 0 auto; }
        .view { display: none; }
        .view.active { display: block; }

        /* TABELLA BLINDATA (NON PUÒ SMERDARSI) */
        .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: rgba(255,255,255,0.03); padding: 15px; text-align: left; font-size: 0.7rem; color: #8b949e; border-bottom: 2px solid var(--border); }
        td { padding: 15px; border-bottom: 1px solid var(--border); vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* BADGE */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; border: 1px solid currentColor; }
        .STATUS-APPROVATO { color: var(--blue); background: rgba(88,166,255,0.1); }
        .STATUS-IN-VALUTAZIONE { color: var(--yellow); background: rgba(210,153,34,0.1); }
        .STATUS-RESPINTO { color: var(--red); background: rgba(248,81,73,0.1); }

        /* GRID REPORT AI */
        .ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .ai-card { 
            background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 20px; border-top: 4px solid var(--purple); position: relative;
        }
        .ai-card h3 { margin: 0 0 10px 0; font-size: 1.1rem; color: #fff; }
        .ai-card p { font-size: 0.85rem; line-height: 1.6; color: #adbac7; }
    </style>
</head>
<body>

    <header>
        <div>
            <h1 style="margin:0; font-size:1.2rem;">SISTEMA ACQUISTI v9.0</h1>
            <small>IIS ANTONIO SCARPA</small>
        </div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchView('tabella', this)">MONITORAGGIO</button>
            <button class="nav-btn" onclick="switchView('report', this)">REPORT AI</button>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" height="40">
    </header>

    <div class="container">
        <div id="tabella" class="view active">
            <div class="table-wrap">
                <table>
                    <colgroup>
                        <col style="width: 100px"> <col style="width: 150px"> <col style="width: 180px"> <col style="width: 150px"> <col style="">             </colgroup>
                    <thead>
                        <tr>
                            <th>DATA</th>
                            <th>DIPARTIMENTO</th>
                            <th>STATO</th>
                            <th>RESPONSABILE</th>
                            <th>OGGETTO</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>

        <div id="report" class="view">
            <div class="ai-grid" id="aiGrid"></div>
        </div>
    </div>

    <script>
        const URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        function switchView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        async function fetchData() {
            try {
                const response = await fetch(`${URL}&nocache=${Date.now()}`);
                const text = await response.text();
                
                // PARSING AVANZATO (Protegge dalle virgole interne)
                const rows = text.split(/\r?\n/).slice(1);
                const tableBody = document.getElementById('tbody');
                const aiGrid = document.getElementById('aiGrid');
                
                tableBody.innerHTML = '';
                aiGrid.innerHTML = '';

                rows.forEach(row => {
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(c.length >= 5) {
                        const clean = (s) => (s || "").replace(/^"|"$/g, '').trim();
                        
                        const d = {
                            date: clean(c[0]),
                            dept: clean(c[1]),
                            ai:   clean(c[2]),
                            stat: clean(c[3]) || "IN VALUTAZIONE",
                            resp: clean(c[4]),
                            obj:  clean(c[5])
                        };

                        // 1. Riga Tabella
                        const tr = document.createElement('tr');
                        const sClass = `STATUS-${d.stat.replace(/\s+/g, '-')}`;
                        tr.innerHTML = `
                            <td style="color:#666">${d.date}</td>
                            <td style="font-weight:bold; color:#fff">${d.dept}</td>
                            <td><span class="badge ${sClass}">${d.stat}</span></td>
                            <td>${d.resp}</td>
                            <td title="${d.obj}">${d.obj}</td>
                        `;
                        tableBody.appendChild(tr);

                        // 2. Card AI
                        if(d.ai && d.ai.length > 10 && !d.ai.includes("Caricamento")) {
                            const card = document.createElement('div');
                            card.className = 'ai-card';
                            card.innerHTML = `
                                <small style="color:var(--purple)">${d.date} - ${d.resp}</small>
                                <h3>${d.dept}</h3>
                                <p>${d.ai}</p>
                            `;
                            aiGrid.appendChild(card);
                        }
                    }
                });
            } catch (e) { console.error("Errore Caricamento:", e); }
        }

        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
