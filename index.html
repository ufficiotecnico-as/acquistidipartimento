<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ordini Integrale | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14; --card: #161b22; --border: #30363d; --text: #c9d1d9;
            --yellow: #d29922; --purple: #a371f7; --blue: #1f6feb; --green: #238636; --red: #da3633;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; overflow-x: hidden; }
        
        .white-header { 
            background-color: #ffffff; padding: 12px 30px; display: flex; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: sticky; top: 0; z-index: 100; 
        }
        .white-header h1 { color: #000; margin: 0; font-size: 1.3rem; font-weight: 800; }
        .school-logo { max-height: 45px; }

        .main-content { padding: 15px; width: 99%; margin: 0 auto; box-sizing: border-box; }
        
        .table-container { 
            background: var(--card); border: 1px solid var(--border); 
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; table-layout: fixed; }
        
        th { 
            background: rgba(255,255,255,0.03); text-align: left; padding: 15px; 
            color: #8b949e; text-transform: uppercase; font-size: 0.65rem; 
            border-bottom: 2px solid var(--border); letter-spacing: 0.5px;
        }
        
        td { 
            padding: 15px; border-bottom: 1px solid var(--border); 
            vertical-align: top; word-wrap: break-word; line-height: 1.4; 
        }

        /* Badge Stati Colonna D */
        .badge { 
            padding: 5px 10px; border-radius: 12px; font-size: 0.65rem; 
            font-weight: 800; text-transform: uppercase; border: 1px solid transparent; 
            display: inline-block; white-space: nowrap;
        }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210,153,34,0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31,111,235,0.1); }
        .b-completato { border-color: var(--green); color: var(--green); background: rgba(35,134,54,0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218,54,51,0.1); }

        .timestamp { color: #6e7681; font-family: monospace; font-size: 0.75rem; }
        .ai-text { color: var(--purple); font-style: italic; font-size: 0.8rem; }
        tr:hover td { background: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <header class="white-header">
        <h1>SISTEMA MONITORAGGIO ACQUISTI v6.0</h1>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo">
    </header>

    <div class="main-content">
        <div class="table-container">
            <table>
                <colgroup>
                    <col style="width: 8%">  <col style="width: 10%"> <col style="width: 10%"> <col style="width: 12%"> <col style="width: 18%"> <col style="width: 30%"> <col style="width: 12%"> </colgroup>
                <thead>
                    <tr>
                        <th>DATA (A)</th>
                        <th>DIPARTIMENTO (B)</th>
                        <th>STATO (D)</th>
                        <th>RESPONSABILE (E)</th>
                        <th>OBIETTIVO (F)</th>
                        <th>ANALISI GROQ (C)</th>
                        <th>NOTE (H)</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center; padding:50px; color:#666;">Sincronizzazione dati in corso...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';

        async function syncData() {
            try {
                // nocache= Date.now() forza il download di dati nuovi bypassando la memoria del browser
                const response = await fetch(`${CSV_URL}&nocache=${Date.now()}`);
                const csvText = await response.text();
                
                // Dividiamo le righe e puliamo quelle vuote
                const rows = csvText.split(/\r?\n/).slice(1).filter(row => row.trim() !== "");
                
                const tbody = document.getElementById('tableBody');
                let htmlContent = '';

                rows.forEach(row => {
                    // Split che rispetta le virgole dentro i doppi apici (fondamentale per la colonna C di Groq)
                    const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    if(c.length >= 6) {
                        // Funzione per pulire virgolette e spazi bianchi
                        const clean = (val) => (val || "").replace(/^"|"$/g, '').trim();

                        const colA = clean(c[0]); // Timestamp
                        const colB = clean(c[1]); // Dipartimento
                        const colC = clean(c[2]); // Analisi AI
                        const colD = clean(c[3]); // Stato
                        const colE = clean(c[4]); // Responsabile
                        const colF = clean(c[5]); // Obiettivo
                        const colH = clean(c[7]) || "-"; // Note (Indice 7 = H)

                        // Controllo se l'analisi è ancora in caricamento nel foglio
                        const displayAI = (colC.toLowerCase().includes("caricamento") || colC === "") 
                            ? `<span style="color:#666; font-size:0.7rem;">[ Elaborazione IA in corso... ]</span>` 
                            : `<span class="ai-text">${colC}</span>`;

                        // Logica Colori Badge (Colonna D)
                        let badgeClass = 'b-valutazione';
                        const s = colD.toUpperCase();
                        if(s.includes('APPROVATO')) badgeClass = 'b-approvato';
                        else if(s.includes('COMPLETATO')) badgeClass = 'b-completato';
                        else if(s.includes('RESPINTO')) badgeClass = 'b-respinto';

                        htmlContent += `
                            <tr>
                                <td class="timestamp">${colA}</td>
                                <td style="font-weight:800; color:#fff;">${colB}</td>
                                <td><span class="badge ${badgeClass}">${colD}</span></td>
                                <td style="color:#fff;">${colE}</td>
                                <td style="font-size: 0.75rem; color:#adbac7;">${colF}</td>
                                <td>${displayAI}</td>
                                <td style="color:#8b949e; font-size: 0.75rem;">${colH}</td>
                            </tr>
                        `;
                    }
                });

                tbody.innerHTML = htmlContent || '<tr><td colspan="7" style="text-align:center;">Nessun dato trovato.</td></tr>';
            } catch (error) {
                console.error("Errore Fetch:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">Errore nel caricamento dei dati. Controlla la connessione.</td></tr>';
            }
        }

        // Prima esecuzione
        syncData();
        
        // Aggiornamento ogni 15 secondi
        setInterval(syncData, 15000);
    </script>
</body>
</html>
