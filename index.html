<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Ordini v5.0 | IIS Scarpa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --yellow: #d29922; --purple: #8957e5; --blue: #1f6feb; --green: #238636; --red: #da3633;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, var(--border) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text); margin: 0; padding: 0; overflow-x: hidden;
        }

        /* HEADER BIANCO */
        .white-header {
            background-color: #ffffff; padding: 15px 40px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 100;
        }
        .white-header h1 { color: #000; margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        .white-header p { color: #666; margin: 0; letter-spacing: 3px; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }
        .school-logo { max-height: 60px; }

        .main-content { padding: 40px; max-width: 1400px; margin: 0 auto; }

        /* TABELLA */
        .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { background: rgba(255,255,255,0.02); text-align: left; padding: 20px 25px; font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 20px 25px; border-top: 1px solid var(--border); cursor: pointer; transition: 0.2s; vertical-align: middle; }
        tr:hover td { background: rgba(255,255,255,0.04); }
        
        .dept-name { font-weight: 700; color: #fff; font-size: 1.05rem; }
        
        .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; border: 1px solid transparent; display: inline-block; }
        .b-valutazione { border-color: var(--yellow); color: var(--yellow); background: rgba(210,153,34,0.1); }
        .b-integrazione { border-color: var(--purple); color: var(--purple); background: rgba(137,87,229,0.1); }
        .b-approvato { border-color: var(--blue); color: var(--blue); background: rgba(31,111,235,0.1); }
        .b-completato { border-color: var(--green); color: var(--green); background: rgba(35,134,54,0.1); }
        .b-respinto { border-color: var(--red); color: var(--red); background: rgba(218,54,51,0.1); }

        /* PANNELLO LATERALE */
        .side-drawer {
            position: fixed; top: 0; right: -550px; width: 500px; height: 100%;
            background: rgba(13, 17, 23, 0.98); backdrop-filter: blur(20px);
            border-left: 1px solid var(--border); z-index: 1000;
            transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 40px;
            box-shadow: -20px 0 50px rgba(0,0,0,0.7); overflow-y: auto;
        }
        .side-drawer.open { right: 0; }
        .drawer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 999; backdrop-filter: blur(4px);
        }

        .ai-box {
            background: linear-gradient(145deg, rgba(137, 87, 229, 0.05), rgba(31, 111, 235, 0.05));
            border: 1px solid rgba(137, 87, 229, 0.3); border-radius: 16px; padding: 25px; margin-top: 30px;
        }
        .ai-title { color: var(--purple); font-weight: 800; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .detail-label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; margin-top: 25px; display: block; font-weight: 600; letter-spacing: 1px; }
        .detail-value { color: #fff; font-size: 1.2rem; font-weight: 600; margin-top: 8px; display: block; }
        
        .close-btn { background: rgba(255,255,255,0.05); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; position: absolute; top: 30px; right: 30px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-btn:hover { background: rgba(255,255,255,0.15); transform: rotate(90deg); }
    </style>
</head>
<body>

    <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
    
    <div class="side-drawer" id="drawer">
        <button class="close-btn" onclick="closeDrawer()">✕</button>
        
        <div style="margin-top: 20px;">
            <span id="d-status" class="badge">STATO</span>
            <h2 id="d-name" style="font-size: 2.2rem; font-weight: 800; margin: 15px 0 5px 0; color: #fff; letter-spacing: -1px;">Dipartimento</h2>
            <span id="d-time" style="color: #666; font-size: 0.85rem;">-</span>
        </div>

        <span class="detail-label">Richiedente / Docente</span>
        <span id="d-docente" class="detail-value">-</span>

        <span class="detail-label">Specifiche Materiale</span>
        <div id="d-specs" style="background: rgba(255,255,255,0.03); padding: 20px; border-radius: 12px; line-height: 1.6; color: #adbac7; margin-top: 10px; border: 1px solid var(--border); font-size: 0.95rem;">
            ...
        </div>

        <div class="ai-box">
            <div class="ai-title">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.886a26.58 26.58 0 0 0 4.94 0C11.765 5.765 13 8.062v1.157a4.448 4.448 0 0 1-1.452 3.354A.5.5 0 0 1 11 12.184V13.5a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 5 13.5v-1.316a.5.5 0 0 1-.548-.388A4.448 4.448 0 0 1 3 9.22V8.062Z"/>
                </svg>
                Analisi Groq AI
            </div>
            <div id="d-ai" style="color: #e6edf3; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap;">
                Caricamento...
            </div>
        </div>
    </div>

    <header class="white-header">
        <div class="title-group">
            <h1>ORDINI DI DIPARTIMENTO</h1>
            <p>IIS Antonio Scarpa</p>
        </div>
        <img src="https://cspace.spaggiari.eu//pub/TVII0004/TVII0004-intestazione-nuova-senzaloghi.png?_t=1712923868" class="school-logo" alt="Logo">
    </header>

    <div class="main-content">
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Dipartimento</th>
                        <th>Stato Attuale</th>
                        <th>Docente</th>
                        <th>Data Invio</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vStwBeDM8iQP9AQCvZP0ZPVaddOqmaGc9Iqpt_cFB8KNbEMhGH2apC2zkC1yJ5bU9HGZljDLTYMAcgw/pub?gid=1101694915&single=true&output=csv';
        let db = [];

        async function sync() {
            try {
                const res = await fetch(CSV + '&t=' + Date.now());
                const text = await res.text();
                // Separiamo le righe gestendo i ritorni a capo
                const lines = text.split(/\r?\n/);
                const rows = lines.slice(1);
                
                db = [];
                rows.forEach(r => {
                    // Regex avanzata per dividere le colonne ignorando virgole dentro i doppi apici
                    const c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(c.length < 3) return;
                    
                    const name = (c[1] || "").replace(/"/g,'').trim();
                    if(!name) return;

                    db.push({
                        time: (c[0] || "").replace(/"/g,'').trim(),
                        name: name,
                        docente: (c[2] || "").replace(/"/g,'').trim(),
                        status: (c[3] || "IN VALUTAZIONE").replace(/"/g,'').trim().toUpperCase(),
                        specs: (c[4] || "Nessuna specifica").replace(/"/g,'').trim(),
                        ai: (c[5] || "Analisi non disponibile").replace(/"/g,'').trim()
                    });
                });
                render();
            } catch(e) { console.error("Errore Sync:", e); }
        }

        function getBadgeClass(status) {
            if(status.includes('APPROVATO')) return 'b-approvato';
            if(status.includes('INTEGRAZIONE')) return 'b-integrazione';
            if(status.includes('COMPLETATO')) return 'b-completato';
            if(status.includes('RESPINTO')) return 'b-respinto';
            return 'b-valutazione';
        }

        function render() {
            const body = document.getElementById('tableBody');
            body.innerHTML = db.map(o => {
                const cls = getBadgeClass(o.status);
                return `<tr onclick="openDrawer('${o.name.replace(/'/g, "\\'")}')">
                    <td class="dept-name">${o.name}</td>
                    <td><span class="badge ${cls}">${o.status}</span></td>
                    <td style="font-weight:600; color: #fff;">${o.docente}</td>
                    <td style="color: #666; font-size: 0.85rem;">${o.time}</td>
                </tr>`;
            }).join('');
        }

        function openDrawer(name) {
            const data = db.find(o => o.name === name);
            if(!data) return;

            document.getElementById('d-name').innerText = data.name;
            document.getElementById('d-status').innerText = data.status;
            document.getElementById('d-status').className = 'badge ' + getBadgeClass(data.status);
            document.getElementById('d-docente').innerText = data.docente;
            document.getElementById('d-specs').innerText = data.specs;
            document.getElementById('d-ai').innerText = data.ai;
            document.getElementById('d-time').innerText = "Inviato il: " + data.time;
            
            document.getElementById('drawer').classList.add('open');
            document.getElementById('overlay').style.display = 'block';
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('overlay').style.display = 'none';
        }

        sync();
        setInterval(sync, 15000); 
    </script>
</body>
</html>
